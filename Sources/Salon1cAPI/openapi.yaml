openapi: 3.1.0
info:
  title: "API 1С:SPA-Салон, редакция 3.0"
  description: |
    Документация API для 1С:SPA-Салон, редакция 3.0.

    Документ написан вручную по единственному опубликованному источнику —
    API Blueprint на Apiary (https://salon1c.docs.apiary.io/), слепок которого
    хранится в `Upstream/salon1c/salon1c.apib`. Происхождение каждой операции
    и схемы прослеживается до раздела этого файла; расхождения внутри самого
    источника задокументированы в TechDebt, а не «исправлены» молча.
  version: "3.0"
  contact:
    name: "1С:Салон красоты"
    url: "https://salon1c.ru"
  license:
    name: "Proprietary"

servers:
  - url: "http://cloud.salon1c.ru/api"
    description: "Облачный сервер 1С, как задокументировано в HOST источника. Префикс `/api` и отсутствие HTTPS не проверены по проводу — TechDebt TD-1. Локальные развёртывания меняют базу целиком — `Client.init(serverURL:)`."

security:
  - ApiKeyAuth: []

tags:
  - name: auth
    description: "Авторизация — варианты входа, usertoken, цифровая подпись"
  - name: booking
    description: "Запись на визит — услуги, сотрудники, даты, слоты, запись, перенос, отмена, стоимость"
  - name: visits
    description: "Визиты — списки оконченных и текущих визитов"
  - name: visit-payment
    description: "Оплата визитов — долговые визиты и оплата"
  - name: clients
    description: "Клиенты — карточки, счета, история, пакеты услуг"
  - name: salons
    description: "Салоны — справочная информация"
  - name: services
    description: "Услуги — записи и списки услуг"
  - name: ratings
    description: "Оценки и комментарии клиентов"
  - name: shop
    description: "Онлайн-магазин — прайс, корзина, заказы, доставка"
  - name: terminal
    description: "Терминал самообслуживания — API v2 без salon_id"

paths:
  /hs/api/v1/auth_types/{salon_id}/:
    get:
      operationId: "getAuthTypes"
      tags: [auth]
      summary: "Получить доступные варианты авторизации"
      description: |
        Возвращает массив способов авторизации, доступных клиенту. Поле `method` —
        способ: `incoming` (код подтверждения приходит клиенту) или `outgoing`
        (клиент совершает действие — сообщение боту или звонок). Поле `type` —
        канал: `sms`, `whats_app`, `call`, `outgoing_telegram`,
        `outgoing_whatsapp`, `outgoing_call`; источник показывает и `email`,
        которого нет в его же перечне — список открыт, поэтому `type`/`method`
        остаются строками, а не перечислениями.
        Источник: `salon1c.apib` → Group Авторизация → auth_types.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      responses:
        '200':
          description: "Список доступных вариантов авторизации"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTypesResponse'

  /hs/api/v1/auth/{salon_id}/:
    post:
      operationId: "authorize"
      tags: [auth]
      summary: "Авторизоваться"
      description: |
        Авторизация клиента через СМС-подтверждение или иной метод (`auth_type`).
        Без `confirmation_code` система генерирует и отправляет новый код —
        ответ в форме `AuthCodeSentEnvelope`. С корректным кодом возвращается
        `UserToken` — ответ в форме `UserTokenEnvelope`, один и тот же HTTP 200,
        поэтому `oneOf`.
        URI-шаблон источника объявляет параметры и строкой запроса, и телом;
        пример показывает тело — модель держит тело, расхождение в TD-4.
        Источник: `salon1c.apib` → Group Авторизация → auth.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: "Код отправлен или UserToken выдан — две документированные формы"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /hs/api/v1/validity_usertoken/{salon_id}/:
    post:
      operationId: "checkUserToken"
      tags: [auth]
      summary: "Валидность ключа пользователя"
      description: |
        Проверяет корректность и актуальность `usertoken`. `salon_id` в пути
        обязателен, но на проверку не влияет — источник разрешает любой ID салона.
        Ответ без обёртки: голый `{ "Result": bool }`, третья форма ответа в API.
        Источник: `salon1c.apib` → Group Авторизация → validity_usertoken.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
      responses:
        '200':
          description: "Валидность ключа"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsertokenValidityResponse'

  /hs/api/v1/private_auth/{salon_id}/:
    post:
      operationId: "authorizeWithSignature"
      tags: [auth]
      summary: "Авторизация с цифровой подписью"
      description: |
        Авторизация по клиентским данным и цифровой подписи `sign` (SHA-256),
        подтверждающей целостность переданных данных. Как и у `auth`, URI-шаблон
        перечисляет поля строкой запроса, а пример шлёт JSON-тело — модель держит
        тело (TD-4).
        Источник: `salon1c.apib` → Group Авторизация → private_auth.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateAuthRequest'
      responses:
        '200':
          description: "UserToken клиента"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenEnvelope'

  /hs/api/v1/auth_request/{salon_id}:
    post:
      operationId: "requestPhoneConfirmation"
      tags: [auth]
      summary: "Запрос на подтверждение номера телефона"
      description: |
        Формирует запрос на подтверждение номера: клиент либо отправляет сообщение
        боту, либо звонит на указанный номер. `method` — способ:
        `outgoing_telegram`, `outgoing_call`, `outgoing_whatsapp`. Ответ несёт
        `outgoing_id` (номер или бот) и/или `link` для завершения. В таблице
        источника поле опечатано `reqiest_id`, пример показывает `request_id` —
        модель держит пример.
        Источник: `salon1c.apib` → Group Авторизация → auth_request.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneConfirmationRequest'
      responses:
        '200':
          description: "Данные для подтверждения номера"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneConfirmationResponse'

  /hs/api/v1/auth_token/{salon_id}:
    post:
      operationId: "getClientToken"
      tags: [auth]
      summary: "Токен клиента при исходящей авторизации"
      description: |
        Выдаёт клиентский `UserToken`, если номер подтверждён (через
        `requestPhoneConfirmation`). Неподтверждённый номер — ошибка 1201
        внутри `Errors.code` при HTTP 200.
        Источник: `salon1c.apib` → Group Авторизация → auth_token.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientTokenRequest'
      responses:
        '200':
          description: "UserToken клиента"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenEnvelope'

  /hs/api/v1/book_services/{salon_id}/:
    get:
      operationId: "getBookableServices"
      tags: [booking]
      summary: "Услуги, доступные для записи"
      description: |
        Возвращает массив услуг, доступных для записи. Отборы `staff_id` и `datetime`
        сужают выдачу до услуг конкретного сотрудника и/или времени; `service_ids`
        задаёт последовательность услуг, которую сотрудник должен оказать подряд
        (при отсутствии таких сотрудников — ошибка 1080 в `Errors.code`).
        Без отборов — все услуги всех сотрудников начиная с текущей даты сеанса.
        В примере источника `Errors` отсутствует — поле остаётся optional.
        Источник: `salon1c.apib` → Group Онлайн запись → book_services.
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/StaffIdQuery'
        - $ref: '#/components/parameters/DatetimeQuery'
        - $ref: '#/components/parameters/ServiceIds'
      responses:
        '200':
          description: "Массив доступных услуг"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookableServicesResponse'

  /hs/api/v1/book_staff/{salon_id}/:
    get:
      operationId: "getBookableStaff"
      tags: [booking]
      summary: "Сотрудники, доступные для записи"
      description: |
        Возвращает массив сотрудников, доступных для записи. Отборы `service_id`
        и `datetime` сужают выдачу; `service_ids` — последовательность услуг
        (ошибка 1080, если таких сотрудников нет). Без отборов — все сотрудники,
        могущие оказать хотя бы одну услугу, начиная с текущей даты сеанса.
        Пример источника синтаксически невалиден (лишний блок `comments_count`)
        и содержит опечатку `rsating` — модель держит таблицу полей (TD-6).
        Источник: `salon1c.apib` → Group Онлайн запись → book_staff.
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/ServiceIdQuery'
        - $ref: '#/components/parameters/DatetimeQuery'
        - $ref: '#/components/parameters/ServiceIds'
      responses:
        '200':
          description: "Массив доступных сотрудников"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookableStaffResponse'

  /hs/api/v1/book_dates/{salon_id}/:
    get:
      operationId: "getBookableDates"
      tags: [booking]
      summary: "Даты, доступные для записи"
      description: |
        Возвращает массив дат за период `start_date`–`end_date` (границы
        автоматически расширяются до начала/конца дня). Отборы `service_id`,
        `staff_id`, `service_ids` сужают до дат, когда можно записаться
        на выбранное. Даты в ответе — ISO-8601 строками.
        Источник: `salon1c.apib` → Group Онлайн запись → book_dates.
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/ServiceIdQuery'
        - $ref: '#/components/parameters/StaffIdQuery'
        - $ref: '#/components/parameters/ServiceIds'
      responses:
        '200':
          description: "Массив доступных дат"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookableDatesResponse'

  /hs/api/v1/book_times/{salon_id}/:
    get:
      operationId: "getBookableTimes"
      tags: [booking]
      summary: "Слоты, доступные для записи"
      description: |
        Возвращает массив свободных слотов с `datetime` до конца дня. Отборы
        `service_id`, `staff_id`, `service_ids` сужают выдачу; без `datetime`
        используется текущая дата сеанса.
        Источник: `salon1c.apib` → Group Онлайн запись → book_times.
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/DatetimeQuery'
        - $ref: '#/components/parameters/ServiceIdQuery'
        - $ref: '#/components/parameters/StaffIdQuery'
        - $ref: '#/components/parameters/ServiceIds'
      responses:
        '200':
          description: "Массив доступных слотов"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookableTimesResponse'

  /hs/api/v1/recording_dates/{salon_id}/:
    get:
      operationId: "getRecordingDates"
      tags: [booking]
      summary: "Даты записи"
      description: |
        Возвращает массив дат записей по сотрудникам за период; без `service_id`/
        `staff_id` — интервалы всех доступных для записи сотрудников. Даты в
        ответе идут строками `дд.мм.гггг чч:мм:сс` — третий диалект дат
        документа (TD-7), тип остаётся `string`.
        Источник: `salon1c.apib` → Group Онлайн запись → recording_dates.
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/ServiceIdQuery'
        - $ref: '#/components/parameters/StaffIdQuery'
      responses:
        '200':
          description: "Массив дат записи по сотрудникам"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingDatesResponse'

  /hs/api/v1/book_record/{salon_id}/:
    post:
      operationId: "bookVisit"
      tags: [booking]
      summary: "Запись на визит"
      description: |
        Записывает клиента на услуги (`record_array`) в указанное время к
        выбранным сотрудникам; клиент определяется по `usertoken`. При первом
        вызове создаётся визит и возвращается его идентификатор; пересекающиеся
        по времени услуги трактуются как параллельные. Передав `record_id`
        существующего визита, остальные поля не передают.
        В примере тела источник вставил форму *ответа* (`Parameters`/`Errors`),
        а список `+ Attributes` описывает плоское тело — модель держит
        `+ Attributes` (TD-6). `Errors` в ответе бывает `null`.
        Источник: `salon1c.apib` → Group Онлайн запись → book_record.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookVisitRequest'
      responses:
        '200':
          description: "Результат записи; при статусе `TemporarilyReservedNeedPayment` — `sum` и `may_be_payment`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookVisitResponse'

  /hs/api/v1/change_record/{salon_id}/:
    put:
      operationId: "rescheduleVisit"
      tags: [booking]
      summary: "Перенос визита"
      description: |
        Проверяет возможность переноса визита на `datetime` и переносит, если
        возможно. Успех — `Parameters.Result: true`.
        Источник: `salon1c.apib` → Group Онлайн запись → change_record.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/RecordId'
        - name: datetime
          in: query
          required: true
          description: "Новая дата и время визита в iso8601 (пример `20170820T1030`)"
          schema:
            type: string
      responses:
        '200':
          description: "Результат переноса"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'

  /hs/api/v1/cancel_record/{salon_id}/:
    delete:
      operationId: "cancelVisit"
      tags: [booking]
      summary: "Отмена записи"
      description: |
        Отменяет запись на визит. Успех — `Parameters.Result: true`;
        `Errors` в примере `null`.
        Источник: `salon1c.apib` → Group Онлайн запись → cancel_record.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: "Результат отмены"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'

  /hs/api/v1/record_cost/{salon_id}/:
    get:
      operationId: "getRecordCost"
      tags: [booking]
      summary: "Расчет стоимости записи"
      description: |
        Рассчитывает стоимость визита с учётом услуг записи и действующих
        маркетинговых акций; `record_array` — JSON-строка с параметрами записи
        (тот же объект `RecordItem`, что в теле `bookVisit`). Для применения
        скидок требуется `usertoken`. Ответ — нижний (lowercase) диалект
        конверта, в отличие от соседей по группе (TD-5).
        Источник: `salon1c.apib` → Group Онлайн запись → record_cost.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/RecordArrayQuery'
        - name: promocode
          in: query
          required: false
          description: "Промокод"
          schema:
            type: string
      responses:
        '200':
          description: "Корзина с итогами расчёта"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordCostResponse'

  /hs/api/v1/finished_visites/{salon_id}/:
    get:
      operationId: "getFinishedVisits"
      tags: [visits]
      summary: "Оконченные визиты"
      description: |
        Возвращает массив оконченных визитов за период; `start_date`/`end_date`
        здесь optional — в отличие от `getBookableDates` (TD-6). Имя пути
        `visites` — опечатка источника, сохранена как есть.
        Источник: `salon1c.apib` → Group Визиты → finished_visites.
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/StartDateOptional'
        - $ref: '#/components/parameters/EndDateOptional'
      responses:
        '200':
          description: "Массив оконченных визитов"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitsResponse'

  /hs/api/v1/visites/{salon_id}/:
    get:
      operationId: "getVisits"
      tags: [visits]
      summary: "Список визитов"
      description: |
        Возвращает массив визитов за период — та же структура, что у
        `getFinishedVisits`, плюс поле `status` (`Archival`, `NotCame`,
        `Expected`, `Came`, `Finished`, `Canceled` — открытая строка).
        Проза источника ошибочно обещает «массив оконченных визитов» (TD-6);
        `status` покрывает и неоконченные.
        Источник: `salon1c.apib` → Group Визиты → visites.
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/StartDateOptional'
        - $ref: '#/components/parameters/EndDateOptional'
      responses:
        '200':
          description: "Массив визитов"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitsResponse'

  /hs/api/v1/debt_visits/{salon_id}:
    get:
      operationId: "getDebtVisits"
      tags: [visit-payment]
      summary: "Долговые визиты"
      description: |
        Возвращает массив визитов с долгами. Полезная нагрузка — в регистре
        PascalCase и *внутри* объектов (`Id`, `Customer`, `Services`…) — четвёртая
        регистровая разновидность документа (TD-5). Путь без завершающего `/`,
        как в источнике.
        Источник: `salon1c.apib` → Group Оплата визитов → debt_visits.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      responses:
        '200':
          description: "Массив долговых визитов"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtVisitsResponse'

  /hs/api/v1/visit_payment/{salon_id}/:
    post:
      operationId: "payVisit"
      tags: [visit-payment]
      summary: "Оплатить визит"
      description: |
        Проверяет возможность оплаты визита и проводит её; клиент определяется
        по `usertoken`. Успех — `Parameters.Result: true`.
        Источник: `salon1c.apib` → Group Оплата визитов → visit_payment.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitPaymentRequest'
      responses:
        '200':
          description: "Результат оплаты"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'

  /hs/api/v1/client/{salon_id}/:
    get:
      operationId: "getClientInfo"
      tags: [clients]
      summary: "Информация о клиенте"
      description: |
        Карточка клиента, определяемого по `usertoken`. URI-шаблон источника
        предусматривает и `client_id` строкой запроса, хотя проза говорит только
        о `usertoken` — параметр смоделирован optional (TD-6).
        Источник: `salon1c.apib` → Group Клиенты → client.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - name: client_id
          in: query
          required: false
          description: "Идентификатор клиента; объявлен в URI-шаблоне, в прозе не описан (TD-6)"
          schema:
            type: string
      responses:
        '200':
          description: "Карточка клиента"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCardResponse'
    post:
      operationId: "createClient"
      tags: [clients]
      summary: "Создание клиента"
      description: |
        Создаёт клиента из полей `ClientCreate`. Тело повторяет `salon_id`
        из пути — так объявлено в `+ Attributes` источника (TD-6).
        `phone` объявлен `number` — редкое исключение среди строковых телефонов
        документа (TD-6). Ответ — единственный задокументированный HTTP 201
        вместе с `updateClientById`.
        Источник: `salon1c.apib` → Group Клиенты → client (Создание клиента).
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreateRequest'
      responses:
        '201':
          description: "Клиент создан"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: "Неверные данные или отсутствует apikey — код 1001 в `Errors.code`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsEnvelope'
    put:
      operationId: "updateClientById"
      tags: [clients]
      summary: "Изменение клиента"
      description: |
        Изменяет клиента с `id` в теле; `phone` передавать не обязательно.
        Ответ 201, как у создания — так документировано (TD-6).
        Источник: `salon1c.apib` → Group Клиенты → client (Изменение клиента).
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdateRequest'
      responses:
        '201':
          description: "Клиент изменён"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: "Неверные данные или отсутствует apikey"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsEnvelope'

  /hs/api/v1/clients/{salon_id}/:
    post:
      operationId: "searchClients"
      tags: [clients]
      summary: "Информация о клиентах"
      description: |
        Выборка клиентов базы с фильтрацией, выбором полей, сортировкой
        и пагинацией — ответ несёт `Meta` (первый случай в документе).
        `salon_id` повторяется в теле по `+ Attributes` источника (TD-6).
        Источник: `salon1c.apib` → Group Клиенты → clients.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientsQuery'
      responses:
        '200':
          description: "Список клиентов с пагинацией"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientsResponse'
        '400':
          description: "Неверные данные или заголовки"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsEnvelope'

  /hs/api/v1/deposit_list/{salon_id}/:
    get:
      operationId: "getClientAccounts"
      tags: [clients]
      summary: "Лицевые и бонусные счета клиента"
      description: |
        Счета клиента по `usertoken`; `with_advance` добавляет авансовый счёт
        (у него `id` — `null`).
        Источник: `salon1c.apib` → Group Клиенты → deposit_list.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - name: with_advance
          in: query
          required: false
          description: "Истина — включить авансовый счёт"
          schema:
            type: boolean
      responses:
        '200':
          description: "Массив счетов клиента"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientAccountsResponse'

  /hs/api/v1/update_client/{salon_id}:
    post:
      operationId: "updateClientProfile"
      tags: [clients]
      summary: "Обновить информацию о клиенте"
      description: |
        Обновляет данные клиента, определяемого по `usertoken` — в отличие от
        `updateClientById`, который меняет произвольного клиента по `id` под
        одним `apikey`. Путь без завершающего `/`. В примере тела источника
        ключ `"Email"` с большой буквы — модель держит `email` по таблице (TD-6).
        Источник: `salon1c.apib` → Group Клиенты → update_client.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientProfileUpdate'
      responses:
        '200':
          description: "Результат обновления и свежая карточка"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientProfileUpdateResponse'

  /hs/api/v1/refill_deposit/{salon_id}:
    post:
      operationId: "refillDeposit"
      tags: [clients]
      summary: "Пополнить лицевой счет клиента"
      description: |
        Пополняет лицевой счёт. В примере запроса источника заголовки не
        показаны вовсе — `usertoken` не навязан, заметка в TD-6.
        Путь без завершающего `/`.
        Источник: `salon1c.apib` → Group Клиенты → refill_deposit.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefillDepositRequest'
      responses:
        '200':
          description: "Результат пополнения"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'

  /hs/api/v1/records_history/{salon_id}/:
    get:
      operationId: "getClientVisitHistory"
      tags: [clients]
      summary: "История визитов клиента"
      description: |
        Массив оконченных визитов клиента по `usertoken`. Структура услуг здесь
        `name`-ключевая — в отличие от `title`-ключевых `Visit` группы визитов
        (TD-5); статусы `planned`/`arrived`/`ended` — открытая строка.
        Источник: `salon1c.apib` → Group Клиенты → records_history.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
      responses:
        '200':
          description: "Массив визитов клиента"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientVisitsResponse'

  /hs/api/v1/records/{salon_id}/:
    get:
      operationId: "getClientPlannedVisits"
      tags: [clients]
      summary: "Запланированные визиты клиента"
      description: |
        Массив предстоящих визитов клиента по `usertoken` — та же структура,
        что у `getClientVisitHistory` (статус документирован только `planned`,
        строка открыта).
        Источник: `salon1c.apib` → Group Клиенты → records.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
      responses:
        '200':
          description: "Массив запланированных визитов"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientVisitsResponse'
    put:
      operationId: "updateRecord"
      tags: [services]
      summary: "Изменение записи"
      description: |
        Изменяет время, комментарий, статус, длительность записи `id` в теле;
        `salon_id` повторяется и в пути, и в теле — так объявлено (TD-6).
        Ответ — массив `Records`, как у `getRecordsList`, но без `Meta`.
        Делит путь с `getClientPlannedVisits` — GET того же URI: источник
        описывает их в разных группах (Клиенты vs Услуги).
        Источник: `salon1c.apib` → Group Услуги → records.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordUpdateRequest'
      responses:
        '200':
          description: "Массив записей после изменения"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordUpdateResponse'

  /hs/api/v1/tickets/{salon_id}:
    get:
      operationId: "getClientTickets"
      tags: [clients]
      summary: "Список пакетов услуг, разовых услуг"
      description: |
        Пакеты и разовые услуги клиента по `usertoken`. Ключ `avialable_actions`
        в ответе опечатан самим сервером — сохранён дословно; `total_frozen`,
        `freeze_list` и прочие поля примера отсутствуют в таблице — optional.
        Путь без завершающего `/`.
        Источник: `salon1c.apib` → Group Клиенты → tickets.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
      responses:
        '200':
          description: "Массив пакетов и разовых услуг"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketsResponse'

  /hs/api/v1/ticket/{salon_id}/:
    get:
      operationId: "getClientTicket"
      tags: [clients]
      summary: "Подробное описание пакета услуг"
      description: |
        Один пакет/разовая услуга по `id`; `Parameters` — объект, не массив.
        Источник: `salon1c.apib` → Group Клиенты → ticket.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - name: id
          in: query
          required: true
          description: "Идентификатор пакета услуг"
          schema:
            type: string
      responses:
        '200':
          description: "Пакет услуг"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'

  /hs/api/v1/salons/{salon_id}/:
    get:
      operationId: "getSalons"
      tags: [salons]
      summary: "Информация о салонах"
      description: |
        Список доступных салонов с расписанием работы и контактной информацией;
        один `apikey`, без `usertoken`.
        Источник: `salon1c.apib` → Group Салоны → salons.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      responses:
        '200':
          description: "Массив салонов"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalonsResponse'

  /hs/api/v1/records_list/{salon_id}/:
    get:
      operationId: "getRecordsList"
      tags: [services]
      summary: "Информация о записях"
      description: |
        Выборка записей клиентов с фильтрацией и пагинацией (`Meta`).
        Записная книжка — Data Structure `Records` источника.
        Источник: `salon1c.apib` → Group Услуги → records_list.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - name: page
          in: query
          required: false
          schema: {type: integer}
        - name: count
          in: query
          required: false
          schema: {type: integer}
        - name: id
          in: query
          required: false
          description: "Идентификатор записи"
          schema: {type: string}
        - name: client_id
          in: query
          required: false
          description: "Идентификатор клиента"
          schema: {type: string}
      responses:
        '200':
          description: "Массив записей с пагинацией"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordsListResponse'

  /hs/api/v1/services/{salon_id}/:
    get:
      operationId: "getServices"
      tags: [services]
      summary: "Услуги записи"
      description: |
        Список услуг салона с ценами, длительностью, активностью и привязками,
        с пагинацией (`Meta`). Таблица метода и Data Structure `Services`
        расходятся в именах — `category` объект против `category_id`; `staff`
        объект против массива — модель держит таблицу метода для `category`
        и массив для `staff` (TD-6).
        Источник: `salon1c.apib` → Group Услуги → services.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/ServiceIdQuery'
        - $ref: '#/components/parameters/StaffIdQuery'
        - name: category_id
          in: query
          required: false
          description: "Фильтрация по ID категории"
          schema: {type: string}
        - name: page
          in: query
          required: false
          schema: {type: integer}
        - name: count
          in: query
          required: false
          schema: {type: integer}
      responses:
        '200':
          description: "Массив услуг с пагинацией"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicesListResponse'

  /hs/api/v1/record_rating/{salon_id}:
    post:
      operationId: "rateVisit"
      tags: [ratings]
      summary: "Оценивание визита"
      description: |
        Устанавливает оценку и комментарий к визиту. `comment` объявлен number
        в таблице, пример шлёт строку — модель держит пример (TD-6).
        Ответ несёт `"Error": null` единственным числом — пятая регистровая
        разновидность конверта (TD-5). Путь без завершающего `/`.
        Источник: `salon1c.apib` → Group Оценки и комментарии клиентов → record_rating.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateVisitRequest'
      responses:
        '200':
          description: "Результат оценивания"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateVisitResponse'

  /hs/api/v1/comments/{salon_id}/:
    get:
      operationId: "getComments"
      tags: [ratings]
      summary: "Оценки и комментарии клиентов"
      description: |
        Комментарии с оценками по сотруднику за период. `rating`, `page`,
        `page_size` объявлены строками — так в источнике (TD-6). Пагинация здесь
        под ключом `Pagination`, а не `Meta` — ещё одна разновидность конверта
        (TD-5); пример источника синтаксически невалиден вокруг `Pagination`.
        Источник: `salon1c.apib` → Group Оценки и комментарии клиентов → comments.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/StartDateOptional'
        - $ref: '#/components/parameters/EndDateOptional'
        - $ref: '#/components/parameters/StaffIdQuery'
        - name: rating
          in: query
          required: false
          description: "Фильтр по оценке — объявлен строкой (TD-6)"
          schema: {type: string}
        - name: page
          in: query
          required: false
          description: "Страница с 1 — объявлена строкой (TD-6)"
          schema: {type: string}
        - name: page_size
          in: query
          required: false
          description: "Размер страницы, максимум 20, по умолчанию 10 — объявлен строкой (TD-6)"
          schema: {type: string}
      responses:
        '200':
          description: "Массив комментариев с пагинацией"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentsResponse'

  /hs/api/v1/price_list/{salon_id}/:
    get:
      operationId: "getPriceList"
      tags: [shop]
      summary: "Получение прайс-листа"
      description: |
        Прайс-лист номенклатуры; `product_id` и `filters` — JSON-строки в query,
        `page_count`/`page_number` объявлены строками (TD-6). Ответ — нижний
        диалект конверта с уникальной вложенностью: `errors` внутри `parameters`,
        рядом с `navigation` (TD-5). Цена приходит строкой `"1000"` (TD-6).
        Источник: `salon1c.apib` → Group Онлайн-магазин → price_list.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - name: type
          in: query
          required: false
          description: "Тип номенклатуры: `product` | `package` | `gift_certificate`"
          schema: {type: string}
        - name: product_id
          in: query
          required: false
          description: "Строка JSON с массивом идентификаторов номенклатуры; пример `[\"9ad49672-…\", \"8bac3895-…\"]`"
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
        - name: group_id
          in: query
          required: false
          schema: {type: string}
        - name: page_count
          in: query
          required: false
          description: "Единиц номенклатуры на странице — объявлено строкой (TD-6)"
          schema: {type: string}
        - name: page_number
          in: query
          required: false
          description: "Номер стартовой страницы — объявлен строкой (TD-6)"
          schema: {type: string}
        - name: search_line
          in: query
          required: false
          description: "Строка поиска, минимум 3 символа"
          schema: {type: string}
        - name: without_remainder
          in: query
          required: false
          description: "Истина — товары без учёта остатка; по умолчанию Ложь"
          schema: {type: boolean}
        - name: with_group
          in: query
          required: false
          description: "Истина — вернуть и разделы товаров (`group_list` в ответе); по умолчанию Ложь"
          schema: {type: boolean}
        - name: filters
          in: query
          required: false
          description: "Строка JSON с массивом фильтров; состав элементов источником не показан — открытые объекты (TD-6)"
          content:
            application/json:
              schema:
                type: array
                items: {}
        - name: code
          in: query
          required: false
          description: "Код искомой номенклатуры"
          schema: {type: string}
      responses:
        '200':
          description: "Прайс-лист с навигацией; `errors` внутри `parameters`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListResponse'

  /hs/api/v1/cart_cost/{salon_id}/:
    get:
      operationId: "getCartCost"
      tags: [shop]
      summary: "Стоимость корзины с покупками"
      description: |
        Расчёт корзины; `cart`, `delivery`, `cart_pay`, `client` — JSON-строки
        в query (`cart` обязателен). Без `usertoken` сервер возвращает поле
        `user_token` — механизм выдачи токена внутри ответа (TD-6); клиентские
        данные тогда передаются параметром `client`. Нижний диалект конверта.
        Источник: `salon1c.apib` → Group Онлайн-магазин → cart_cost.
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - name: cart
          in: query
          required: true
          description: "Строка JSON с массивом покупок `{purchase_id, count, staff_id?}`; пример `[{\"purchase_id\":\"…\",\"count\":2}]`"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartQueryItem'
        - name: delivery
          in: query
          required: false
          description: "Строка JSON с объектом доставки `{id, price, options}`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryQuery'
        - name: cart_pay
          in: query
          required: false
          description: "Строка JSON с массивом предварительных оплат `{type, amount, id?}`"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentItem'
        - name: client
          in: query
          required: false
          description: "Строка JSON с данными клиента; обязателен без `usertoken`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartClientQuery'
        - name: promocode
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: "Корзина с итогами; без `usertoken` несёт `user_token`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartCostResponse'

  /hs/api/v1/payment/{salon_id}:
    post:
      operationId: "payOrder"
      tags: [shop]
      summary: "Оплатить покупки"
      description: |
        Создаёт документ заказа покупателя и документы оплаты. Ответ — нижний
        диалект конверта и нижний `result` внутри `parameters` (TD-5).
        Путь без завершающего `/`.
        Источник: `salon1c.apib` → Group Онлайн-магазин → payment.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPaymentRequest'
      responses:
        '200':
          description: "Флаг успешности оплаты"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LowercaseResultEnvelope'

  /hs/api/v1/group_list/{salon_id}:
    get:
      operationId: "getProductGroups"
      tags: [shop]
      summary: "Разделы товаров иерархически"
      description: |
        Массив разделов товаров в иерархическом виде — `included_groups`
        рекурсивны. Нижний диалект конверта. Путь без завершающего `/`.
        Источник: `salon1c.apib` → Group Онлайн-магазин → group_list.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      responses:
        '200':
          description: "Массив разделов"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductGroupsResponse'

  /hs/api/v1/contact_information/{salon_id}:
    get:
      operationId: "getStoreContacts"
      tags: [shop]
      summary: "Контактная информация магазина"
      description: |
        Контакты интернет-магазина: виды контактов, график, картинки.
        Нижний диалект конверта. Путь без завершающего `/`.
        Источник: `salon1c.apib` → Group Онлайн-магазин → contact_information.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      responses:
        '200':
          description: "Структура контактов"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreContactsResponse'

  /hs/api/v1/public_offer/{salon_id}:
    get:
      operationId: "getPublicOffer"
      tags: [shop]
      summary: "Публичная оферта"
      description: |
        HTML-код формы публичной оферты — единственная операция с ответом
        не-JSON (`text/html`); пример источника `{}` — заглушка, полезная
        нагрузка — HTML-строка (TD-6). Путь без завершающего `/`.
        Источник: `salon1c.apib` → Group Онлайн-магазин → public_offer.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      responses:
        '200':
          description: "HTML публичной оферты"
          content:
            text/html:
              schema:
                type: string

  /hs/api/v1/order_list/{salon_id}/:
    get:
      operationId: "getOrders"
      tags: [shop]
      summary: "История заказов"
      description: |
        Заказы клиента с `navigation`-пагинацией — третья форма пагинации
        документа (TD-5). `page_count`/`page_number` объявлены строками (TD-6).
        Источник: `salon1c.apib` → Group Онлайн-магазин → order_list.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/StartDateOptional'
        - $ref: '#/components/parameters/EndDateOptional'
        - name: page_count
          in: query
          required: false
          description: "Количество заказов на странице — объявлено строкой (TD-6)"
          schema: {type: string}
        - name: page_number
          in: query
          required: false
          description: "Номер стартовой страницы — объявлен строкой (TD-6)"
          schema: {type: string}
        - name: status
          in: query
          required: false
          description: "УИД статуса заказа"
          schema: {type: string}
        - name: order_number
          in: query
          required: false
          description: "Номер заказа"
          schema: {type: string}
        - name: order_id
          in: query
          required: false
          description: "УИД заказа"
          schema: {type: string}
      responses:
        '200':
          description: "Заказы с навигацией"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'

  /hs/api/v1/order_status_list/{salon_id}:
    get:
      operationId: "getOrderStatuses"
      tags: [shop]
      summary: "Статусы заказов покупателей"
      description: |
        Массив возможных статусов заказов. Нижний диалект конверта.
        Путь без завершающего `/`.
        Источник: `salon1c.apib` → Group Онлайн-магазин → order_status_list.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      responses:
        '200':
          description: "Массив статусов"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusesResponse'

  /hs/api/v1/deposit_detail/{salon_id}/:
    get:
      operationId: "getDepositMovements"
      tags: [shop]
      summary: "Расшифровка движений по счёту"
      description: |
        Движения средств по лицевому/бонусному счёту `deposit_id` с
        `navigation`-пагинацией; `usertoken` в заголовках примера не показан —
        не навязан (TD-6). Даты операций — `yyyy-mm-dd HH:MM`, пятый диалект
        дат (TD-7). `page_count`/`page_number` — строками (TD-6).
        Источник: `salon1c.apib` → Group Онлайн-магазин → deposit_detail.
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - name: deposit_id
          in: query
          required: true
          description: "ID лицевого или бонусного счёта"
          schema: {type: string}
        - name: page_count
          in: query
          required: false
          schema: {type: string}
        - name: page_number
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: "Движения по счёту с навигацией"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositDetailResponse'

  /hs/api/v1/delivery_list/{salon_id}:
    get:
      operationId: "getDeliveryOptions"
      tags: [shop]
      summary: "Услуги по доставке"
      description: |
        Доступные услуги доставки; `id` бывает `null` (самовывоз),
        `code` — `pickup` | `courier`. Нижний диалект конверта.
        Путь без завершающего `/`.
        Источник: `salon1c.apib` → Group Онлайн-магазин → delivery_list.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      responses:
        '200':
          description: "Массив услуг доставки"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryListResponse'

  /hs/api/v1/filter_list/{salon_id}:
    get:
      operationId: "getProductFilters"
      tags: [shop]
      summary: "Фильтры по товарам"
      description: |
        Доступные фильтры номенклатуры (`price`, `tags`, …) со значениями.
        Нижний диалект конверта. Путь без завершающего `/`.
        Источник: `salon1c.apib` → Group Онлайн-магазин → filter_list.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      responses:
        '200':
          description: "Массив фильтров"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterListResponse'

  /hs/api/v2/book_staff:
    get:
      operationId: "getTerminalStaff"
      tags: [terminal]
      summary: "Сотрудники, доступные для записи"
      description: |
        Терминал самообслуживания: без `salon_id`, без завершающего `/`.
        Нижний диалект конверта.
        Источник: `salon1c.apib` → Group Терминал самообслуживания → book_staff.
      parameters:
        - name: datetime
          in: query
          required: false
          description: "Дата `iso8601` (`20170820T0000`); по умолчанию — сегодня"
          schema: {type: string}
      responses:
        '200':
          description: "Доступные сотрудники"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalStaffResponse'

  /hs/api/v2/book_services:
    get:
      operationId: "getTerminalServices"
      tags: [terminal]
      summary: "Услуги, доступные для записи к сотруднику"
      description: |
        Терминал самообслуживания; `staff_id` обязателен.
        Источник: `salon1c.apib` → Group Терминал самообслуживания → book_services.
      parameters:
        - name: staff_id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: "Доступные услуги"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalServicesResponse'

  /hs/api/v2/find_client_by_phone:
    get:
      operationId: "findClientByPhone"
      tags: [terminal]
      summary: "Клиент по номеру телефона"
      description: |
        Находит клиента и возвращает `usertoken` внутри `client_data`;
        незарегистрированный под терминал клиент регистрируется на лету.
        Источник: `salon1c.apib` → Group Терминал самообслуживания → find_client_by_phone.
      parameters:
        - name: phone
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: "Признак нахождения и данные клиента"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalClientLookupResponse'

  /hs/api/v2/auth:
    post:
      operationId: "authorizeTerminal"
      tags: [terminal]
      summary: "Авторизация клиента терминала"
      description: |
        Авторизация без предварительной регистрации; возвращает `usertoken` —
        PascalCase-поле внутри нижнего конверта, гибридный диалект (TD-5).
        Источник: `salon1c.apib` → Group Терминал самообслуживания → auth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalAuthRequest'
      responses:
        '200':
          description: "Ключ клиента"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalAuthResponse'

  /hs/api/v2/cart_cost:
    get:
      operationId: "getTerminalCartCost"
      tags: [terminal]
      summary: "Стоимость корзины терминала"
      description: |
        `cart` — обязательная JSON-строка `[{purchase_id, staff_id}]`, здесь
        `staff_id` обязателен (в v1 — опционален). `payment_list` назван
        «объектом», но пример POST v2 шлёт массив — держим массив (TD-6).
        Позиции ответа несут `nds`/`payment_object`/`payment_method`, которых
        нет у магазинных позиций.
        Источник: `salon1c.apib` → Group Терминал самообслуживания → cart_cost.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - name: cart
          in: query
          required: true
          description: "Строка JSON `[{\"purchase_id\":\"…\",\"staff_id\":\"…\"}]`"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TerminalCartQueryItem'
        - name: payment_list
          in: query
          required: false
          description: "JSON-строка предварительных оплат; названа «объектом», пример v2 — массив (TD-6)"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentItem'
        - name: promocode
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: "Расчёт корзины с НДС и признаками расчёта"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalCartCostResponse'

  /hs/api/v2/payment:
    post:
      operationId: "payTerminal"
      tags: [terminal]
      summary: "Оплатить покупки терминала"
      description: |
        Создаёт документ продажи и документы оплаты; возвращает нижний
        `result` и `record_id`. Пример тела шлёт `amount` строками
        (`"136"`), хотя `PaymentList` объявлен `number` — держим
        объявленный тип (TD-6).
        Источник: `salon1c.apib` → Group Терминал самообслуживания → payment.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalPaymentRequest'
      responses:
        '200':
          description: "Флаг успеха и идентификатор визита"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalPaymentResponse'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: "API-ключ салона. Передаётся на каждый запрос — источник показывает его в заголовках всех операций."
    UserTokenAuth:
      type: apiKey
      in: header
      name: usertoken
      description: "Ключ авторизации клиента (UserToken), выдаётся методами авторизации. Требуется клиентским операциям — помечен `security` на уровне операции."
  parameters:
    SalonId:
      name: salon_id
      in: path
      required: true
      description: "Идентификатор салона (GUID). Присутствует во всех путях v1; у операций v2 его нет — это задокументированное расхождение, а не пропуск."
      schema:
        type: string
    StaffIdQuery:
      name: staff_id
      in: query
      required: false
      description: "Идентификатор сотрудника (GUID)"
      schema:
        type: string
    ServiceIdQuery:
      name: service_id
      in: query
      required: false
      description: "Идентификатор услуги (GUID)"
      schema:
        type: string
    DatetimeQuery:
      name: datetime
      in: query
      required: false
      description: "Дата/время отбора в iso8601; источник иллюстрирует базовым форматом без разделителей (`20170820T0000`) — один из трёх диалектов дат документа (TD-7)"
      schema:
        type: string
    StartDate:
      name: start_date
      in: query
      required: true
      description: "Начало периода в iso8601 (пример `20170820T0000`); автоматически берётся начало дня"
      schema:
        type: string
    EndDate:
      name: end_date
      in: query
      required: true
      description: "Конец периода в iso8601 (пример `20170831T0000`); автоматически берётся конец дня"
      schema:
        type: string
    RecordId:
      name: record_id
      in: query
      required: true
      description: "Идентификатор визита"
      schema:
        type: string
    ServiceIds:
      name: service_ids
      in: query
      required: false
      description: "Строка JSON с массивом услуг, которые сотрудник должен оказать последовательно/одновременно. Пример источника: `{\"services_array\":[\"140df5b4-5a58-11e7-82e7-0050568b5c8d\"]}`. Моделируется как query-параметр с `content: application/json` — сериализация `setQueryItemAsJSON`."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceIdsQuery'
    RecordArrayQuery:
      name: record_array
      in: query
      required: true
      description: "Строка JSON с массивом структур записи `{datetime, service_id, staff_id}`. Пример источника: `[{\"datetime\":\"20240831T1500\",\"service_id\":\"…\",\"staff_id\":\"…\"}]`."
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RecordItem'
    StartDateOptional:
      name: start_date
      in: query
      required: false
      description: "Начало периода в iso8601; автоматически берётся начало дня. Optional — так объявлено у визитовых операций (TD-6)"
      schema:
        type: string
    EndDateOptional:
      name: end_date
      in: query
      required: false
      description: "Конец периода в iso8601; автоматически берётся конец дня. Optional — так объявлено у визитовых операций (TD-6)"
      schema:
        type: string
  schemas:
    ApiError:
      type: object
      description: "Объект ошибки домена: приходит внутри `errors`/`Errors` даже при HTTP 200. Коды 1000–1114 задокументированы в приложении источника; 0 — успех. Поле остаётся открытым integer: каталог не исчерпывающий."
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: "Код ошибки; 0 — успех"
        message:
          type: [string, "null"]
          description: "Описание ошибки; в примерах встречается и пустая строка, и null"
    Meta:
      type: object
      description: "Пагинация в диалекте PascalCase (`Parameters`/`Errors`/`Meta`)."
      properties:
        items_count:
          type: integer
          description: "Общее количество найденных записей"
        pages_count:
          type: integer
          description: "Общее количество страниц"
        page_current:
          type: integer
          description: "Текущая страница"
        page_size:
          type: integer
          description: "Размер страницы"

    # --- Group Авторизация -------------------------------------------------

    AuthTypeItem:
      type: object
      description: "Вариант авторизации. `type`/`method` — открытые строки: источник перечисляет шесть типов и показывает седьмой (`email`) в своём же примере."
      required:
        - type
        - title
      properties:
        type:
          type: string
          description: "Тип авторизации: `sms`, `whats_app`, `call`, `outgoing_telegram`, `outgoing_whatsapp`, `outgoing_call`; в примере источника встречается и `email`"
        title:
          type: string
          description: "Представление типа авторизации"
        method:
          type: string
          description: "Способ авторизации: `incoming` | `outgoing`. Задокументирован в прозе, отсутствует в примере ответа — потому optional."
    AuthTypesResponse:
      type: object
      description: "Нижний (lowercase) диалект конверта."
      properties:
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/AuthTypeItem'
        errors:
          $ref: '#/components/schemas/ApiError'

    AuthRequest:
      type: object
      description: "Тело авторизации. В URI-шаблоне источника поля продублированы и строкой запроса — модель держит тело (TD-4)."
      required:
        - login
      properties:
        login:
          type: string
          description: "Номер телефона клиента, только цифры (пример `79876543210`)"
        confirmation_code:
          type: string
          description: "Код подтверждения; без него система генерирует и шлёт новый"
        name:
          type: string
          description: "Имя клиента"
        last_name:
          type: string
          description: "Фамилия клиента"
        second_name:
          type: string
          description: "Отчество клиента"
        birthday:
          type: string
          description: "Дата рождения в формате `31.12.1990`"
        email:
          type: string
          description: "Электронная почта клиента"
        auth_type:
          type: string
          description: "Выбранный тип авторизации; по умолчанию `sms`. Список — у `getAuthTypes`"
    AuthCodeSentEnvelope:
      type: object
      description: "Форма ответа `authorize` «код отправлен»: гибридный регистр — `Request_id`/`Parameters`/`Error`/`ErrorMessage`, только у этой операции (TD-5). `Request_id` обязателен — это ключ-различитель ветки oneOf: без него любой объект декодировался бы первой веткой."
      required:
        - Request_id
      properties:
        Request_id:
          type: string
        Parameters:
          type: object
          properties:
            sent_SMS:
              type: boolean
        Error:
          type: integer
        ErrorMessage:
          type: [string, "null"]
    UserTokenEnvelope:
      type: object
      description: "Конверт `Parameters`/`Errors` с выданным UserToken — общий ответ операций авторизации. `Parameters.UserToken` обязателен — второй ключ-различитель ветки oneOf у `authorize`."
      required:
        - Parameters
      properties:
        Parameters:
          type: object
          required:
            - UserToken
          properties:
            UserToken:
              type: string
              description: "Ключ клиента для заголовка `usertoken`"
        Errors:
          $ref: '#/components/schemas/ApiError'
    AuthResponse:
      description: "Обе задокументированные формы ответа `authorize`: «код отправлен» или «UserToken выдан»."
      oneOf:
        - $ref: '#/components/schemas/AuthCodeSentEnvelope'
        - $ref: '#/components/schemas/UserTokenEnvelope'

    UsertokenValidityResponse:
      type: object
      description: "Без конверта — единственная операция с голым ответом (TD-5)."
      properties:
        Result:
          type: boolean

