          type: number
    ClientAccountsResponse:
      type: object
      description: "PascalCase-конверт."
      properties:
        Parameters:
          type: array
          items:
            $ref: '#/components/schemas/ClientAccountEntry'
        Errors:
          $ref: '#/components/schemas/ApiError'

    ClientProfileUpdate:
      type: object
      description: "Тело обновления профиля. `sex` здесь number, в примере тела — число `2`; ключ `Email` примера — опечатка, модель держит `email` (TD-6)."
      properties:
        last_name:
          type: string
        name:
          type: string
        second_name:
          type: string
        birthday:
          type: string
          description: "Формат `31.12.1990`"
        sex:
          type: number
          description: "1 — мужской, 2 — женский"
        phone:
          type: string
        email:
          type: string
    ClientProfileResult:
