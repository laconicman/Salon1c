openapi: 3.1.0
info:
  title: "API 1С:SPA-Салон, редакция 3.0"
  description: |
    Документация API для 1С:SPA-Салон, редакция 3.0.

    Документ написан вручную по единственному опубликованному источнику —
    API Blueprint на Apiary (https://salon1c.docs.apiary.io/), слепок которого
    хранится в `Upstream/salon1c/salon1c.apib`. Происхождение каждой операции
    и схемы прослеживается до раздела этого файла; расхождения внутри самого
    источника задокументированы в TechDebt, а не «исправлены» молча.
  version: "3.0"
  contact:
    name: "1С:Салон красоты"
    url: "https://salon1c.ru"
  license:
    name: "Proprietary"

servers:
  - url: "http://cloud.salon1c.ru/api"
    description: "Облачный сервер 1С, как задокументировано в HOST источника. Префикс `/api` и отсутствие HTTPS не проверены по проводу — TechDebt TD-1. Локальные развёртывания меняют базу целиком — `Client.init(serverURL:)`."

security:
  - ApiKeyAuth: []

tags:
  - name: auth
    description: "Авторизация — варианты входа, usertoken, цифровая подпись"
  - name: booking
    description: "Запись на визит — услуги, сотрудники, даты, слоты, запись, перенос, отмена, стоимость"
  - name: visits
    description: "Визиты — списки оконченных и текущих визитов"
  - name: visit-payment
    description: "Оплата визитов — долговые визиты и оплата"
  - name: clients
    description: "Клиенты — карточки, счета, история, пакеты услуг"
  - name: salons
    description: "Салоны — справочная информация"
  - name: services
    description: "Услуги — записи и списки услуг"
  - name: ratings
    description: "Оценки и комментарии клиентов"
  - name: shop
    description: "Онлайн-магазин — прайс, корзина, заказы, доставка"
  - name: terminal
    description: "Терминал самообслуживания — API v2 без salon_id"

paths:
  /hs/api/v1/auth_types/{salon_id}/:
    get:
      operationId: "getAuthTypes"
      tags: [auth]
      summary: "Получить доступные варианты авторизации"
      description: |
        Возвращает массив способов авторизации, доступных клиенту. Поле `method` —
        способ: `incoming` (код подтверждения приходит клиенту) или `outgoing`
        (клиент совершает действие — сообщение боту или звонок). Поле `type` —
        канал: `sms`, `whats_app`, `call`, `outgoing_telegram`,
        `outgoing_whatsapp`, `outgoing_call`; источник показывает и `email`,
        которого нет в его же перечне — список открыт, поэтому `type`/`method`
        остаются строками, а не перечислениями.
        Источник: `salon1c.apib` → Group Авторизация → auth_types.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      responses:
        '200':
          description: "Список доступных вариантов авторизации"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTypesResponse'

  /hs/api/v1/auth/{salon_id}/:
    post:
      operationId: "authorize"
      tags: [auth]
      summary: "Авторизоваться"
      description: |
        Авторизация клиента через СМС-подтверждение или иной метод (`auth_type`).
        Без `confirmation_code` система генерирует и отправляет новый код —
        ответ в форме `AuthCodeSentEnvelope`. С корректным кодом возвращается
        `UserToken` — ответ в форме `UserTokenEnvelope`, один и тот же HTTP 200,
        поэтому `oneOf`.
        URI-шаблон источника объявляет параметры и строкой запроса, и телом;
        пример показывает тело — модель держит тело, расхождение в TD-4.
        Источник: `salon1c.apib` → Group Авторизация → auth.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: "Код отправлен или UserToken выдан — две документированные формы"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /hs/api/v1/validity_usertoken/{salon_id}/:
    post:
      operationId: "checkUserToken"
      tags: [auth]
      summary: "Валидность ключа пользователя"
      description: |
        Проверяет корректность и актуальность `usertoken`. `salon_id` в пути
        обязателен, но на проверку не влияет — источник разрешает любой ID салона.
        Ответ без обёртки: голый `{ "Result": bool }`, третья форма ответа в API.
        Источник: `salon1c.apib` → Group Авторизация → validity_usertoken.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
      responses:
        '200':
          description: "Валидность ключа"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsertokenValidityResponse'

  /hs/api/v1/private_auth/{salon_id}/:
    post:
      operationId: "authorizeWithSignature"
      tags: [auth]
      summary: "Авторизация с цифровой подписью"
      description: |
        Авторизация по клиентским данным и цифровой подписи `sign` (SHA-256),
        подтверждающей целостность переданных данных. Как и у `auth`, URI-шаблон
        перечисляет поля строкой запроса, а пример шлёт JSON-тело — модель держит
        тело (TD-4).
        Источник: `salon1c.apib` → Group Авторизация → private_auth.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateAuthRequest'
      responses:
        '200':
          description: "UserToken клиента"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenEnvelope'

  /hs/api/v1/auth_request/{salon_id}:
    post:
      operationId: "requestPhoneConfirmation"
      tags: [auth]
      summary: "Запрос на подтверждение номера телефона"
      description: |
        Формирует запрос на подтверждение номера: клиент либо отправляет сообщение
        боту, либо звонит на указанный номер. `method` — способ:
        `outgoing_telegram`, `outgoing_call`, `outgoing_whatsapp`. Ответ несёт
        `outgoing_id` (номер или бот) и/или `link` для завершения. В таблице
        источника поле опечатано `reqiest_id`, пример показывает `request_id` —
        модель держит пример.
        Источник: `salon1c.apib` → Group Авторизация → auth_request.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneConfirmationRequest'
      responses:
        '200':
          description: "Данные для подтверждения номера"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneConfirmationResponse'

  /hs/api/v1/auth_token/{salon_id}:
    post:
      operationId: "getClientToken"
      tags: [auth]
      summary: "Токен клиента при исходящей авторизации"
      description: |
        Выдаёт клиентский `UserToken`, если номер подтверждён (через
        `requestPhoneConfirmation`). Неподтверждённый номер — ошибка 1201
        внутри `Errors.code` при HTTP 200.
        Источник: `salon1c.apib` → Group Авторизация → auth_token.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientTokenRequest'
      responses:
        '200':
          description: "UserToken клиента"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenEnvelope'

  /hs/api/v1/book_services/{salon_id}/:
    get:
      operationId: "getBookableServices"
      tags: [booking]
      summary: "Услуги, доступные для записи"
      description: |
        Возвращает массив услуг, доступных для записи. Отборы `staff_id` и `datetime`
        сужают выдачу до услуг конкретного сотрудника и/или времени; `service_ids`
        задаёт последовательность услуг, которую сотрудник должен оказать подряд
        (при отсутствии таких сотрудников — ошибка 1080 в `Errors.code`).
        Без отборов — все услуги всех сотрудников начиная с текущей даты сеанса.
        В примере источника `Errors` отсутствует — поле остаётся optional.
        Источник: `salon1c.apib` → Group Онлайн запись → book_services.
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/StaffIdQuery'
        - $ref: '#/components/parameters/DatetimeQuery'
        - $ref: '#/components/parameters/ServiceIds'
      responses:
        '200':
          description: "Массив доступных услуг"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookableServicesResponse'

  /hs/api/v1/book_staff/{salon_id}/:
    get:
      operationId: "getBookableStaff"
      tags: [booking]
      summary: "Сотрудники, доступные для записи"
      description: |
        Возвращает массив сотрудников, доступных для записи. Отборы `service_id`
        и `datetime` сужают выдачу; `service_ids` — последовательность услуг
        (ошибка 1080, если таких сотрудников нет). Без отборов — все сотрудники,
        могущие оказать хотя бы одну услугу, начиная с текущей даты сеанса.
        Пример источника синтаксически невалиден (лишний блок `comments_count`)
        и содержит опечатку `rsating` — модель держит таблицу полей (TD-6).
        Источник: `salon1c.apib` → Group Онлайн запись → book_staff.
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/ServiceIdQuery'
        - $ref: '#/components/parameters/DatetimeQuery'
        - $ref: '#/components/parameters/ServiceIds'
      responses:
        '200':
          description: "Массив доступных сотрудников"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookableStaffResponse'

  /hs/api/v1/book_dates/{salon_id}/:
    get:
      operationId: "getBookableDates"
      tags: [booking]
      summary: "Даты, доступные для записи"
      description: |
        Возвращает массив дат за период `start_date`–`end_date` (границы
        автоматически расширяются до начала/конца дня). Отборы `service_id`,
        `staff_id`, `service_ids` сужают до дат, когда можно записаться
        на выбранное. Даты в ответе — ISO-8601 строками.
        Источник: `salon1c.apib` → Group Онлайн запись → book_dates.
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/ServiceIdQuery'
        - $ref: '#/components/parameters/StaffIdQuery'
        - $ref: '#/components/parameters/ServiceIds'
      responses:
        '200':
          description: "Массив доступных дат"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookableDatesResponse'

  /hs/api/v1/book_times/{salon_id}/:
    get:
      operationId: "getBookableTimes"
      tags: [booking]
      summary: "Слоты, доступные для записи"
      description: |
        Возвращает массив свободных слотов с `datetime` до конца дня. Отборы
        `service_id`, `staff_id`, `service_ids` сужают выдачу; без `datetime`
        используется текущая дата сеанса.
        Источник: `salon1c.apib` → Group Онлайн запись → book_times.
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/DatetimeQuery'
        - $ref: '#/components/parameters/ServiceIdQuery'
        - $ref: '#/components/parameters/StaffIdQuery'
        - $ref: '#/components/parameters/ServiceIds'
      responses:
        '200':
          description: "Массив доступных слотов"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookableTimesResponse'

  /hs/api/v1/recording_dates/{salon_id}/:
    get:
      operationId: "getRecordingDates"
      tags: [booking]
      summary: "Даты записи"
      description: |
        Возвращает массив дат записей по сотрудникам за период; без `service_id`/
        `staff_id` — интервалы всех доступных для записи сотрудников. Даты в
        ответе идут строками `дд.мм.гггг чч:мм:сс` — третий диалект дат
        документа (TD-7), тип остаётся `string`.
        Источник: `salon1c.apib` → Group Онлайн запись → recording_dates.
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/ServiceIdQuery'
        - $ref: '#/components/parameters/StaffIdQuery'
      responses:
        '200':
          description: "Массив дат записи по сотрудникам"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingDatesResponse'

  /hs/api/v1/book_record/{salon_id}/:
    post:
      operationId: "bookVisit"
      tags: [booking]
      summary: "Запись на визит"
      description: |
        Записывает клиента на услуги (`record_array`) в указанное время к
        выбранным сотрудникам; клиент определяется по `usertoken`. При первом
        вызове создаётся визит и возвращается его идентификатор; пересекающиеся
        по времени услуги трактуются как параллельные. Передав `record_id`
        существующего визита, остальные поля не передают.
        В примере тела источник вставил форму *ответа* (`Parameters`/`Errors`),
        а список `+ Attributes` описывает плоское тело — модель держит
        `+ Attributes` (TD-6). `Errors` в ответе бывает `null`.
        Источник: `salon1c.apib` → Group Онлайн запись → book_record.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookVisitRequest'
      responses:
        '200':
          description: "Результат записи; при статусе `TemporarilyReservedNeedPayment` — `sum` и `may_be_payment`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookVisitResponse'

  /hs/api/v1/change_record/{salon_id}/:
    put:
      operationId: "rescheduleVisit"
      tags: [booking]
      summary: "Перенос визита"
      description: |
        Проверяет возможность переноса визита на `datetime` и переносит, если
        возможно. Успех — `Parameters.Result: true`.
        Источник: `salon1c.apib` → Group Онлайн запись → change_record.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/RecordId'
        - name: datetime
          in: query
          required: true
          description: "Новая дата и время визита в iso8601 (пример `20170820T1030`)"
          schema:
            type: string
      responses:
        '200':
          description: "Результат переноса"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'

  /hs/api/v1/cancel_record/{salon_id}/:
    delete:
      operationId: "cancelVisit"
      tags: [booking]
      summary: "Отмена записи"
      description: |
        Отменяет запись на визит. Успех — `Parameters.Result: true`;
        `Errors` в примере `null`.
        Источник: `salon1c.apib` → Group Онлайн запись → cancel_record.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200':
          description: "Результат отмены"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'

  /hs/api/v1/record_cost/{salon_id}/:
    get:
      operationId: "getRecordCost"
      tags: [booking]
      summary: "Расчет стоимости записи"
      description: |
        Рассчитывает стоимость визита с учётом услуг записи и действующих
        маркетинговых акций; `record_array` — JSON-строка с параметрами записи
        (тот же объект `RecordItem`, что в теле `bookVisit`). Для применения
        скидок требуется `usertoken`. Ответ — нижний (lowercase) диалект
        конверта, в отличие от соседей по группе (TD-5).
        Источник: `salon1c.apib` → Group Онлайн запись → record_cost.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/RecordArrayQuery'
        - name: promocode
          in: query
          required: false
          description: "Промокод"
          schema:
            type: string
      responses:
        '200':
          description: "Корзина с итогами расчёта"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordCostResponse'

  /hs/api/v1/finished_visites/{salon_id}/:
    get:
      operationId: "getFinishedVisits"
      tags: [visits]
      summary: "Оконченные визиты"
      description: |
        Возвращает массив оконченных визитов за период; `start_date`/`end_date`
        здесь optional — в отличие от `getBookableDates` (TD-6). Имя пути
        `visites` — опечатка источника, сохранена как есть.
        Источник: `salon1c.apib` → Group Визиты → finished_visites.
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/StartDateOptional'
        - $ref: '#/components/parameters/EndDateOptional'
      responses:
        '200':
          description: "Массив оконченных визитов"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitsResponse'

  /hs/api/v1/visites/{salon_id}/:
    get:
      operationId: "getVisits"
      tags: [visits]
      summary: "Список визитов"
      description: |
        Возвращает массив визитов за период — та же структура, что у
        `getFinishedVisits`, плюс поле `status` (`Archival`, `NotCame`,
        `Expected`, `Came`, `Finished`, `Canceled` — открытая строка).
        Проза источника ошибочно обещает «массив оконченных визитов» (TD-6);
        `status` покрывает и неоконченные.
        Источник: `salon1c.apib` → Group Визиты → visites.
      parameters:
        - $ref: '#/components/parameters/SalonId'
        - $ref: '#/components/parameters/StartDateOptional'
        - $ref: '#/components/parameters/EndDateOptional'
      responses:
        '200':
          description: "Массив визитов"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitsResponse'

  /hs/api/v1/debt_visits/{salon_id}:
    get:
      operationId: "getDebtVisits"
      tags: [visit-payment]
      summary: "Долговые визиты"
      description: |
        Возвращает массив визитов с долгами. Полезная нагрузка — в регистре
        PascalCase и *внутри* объектов (`Id`, `Customer`, `Services`…) — четвёртая
        регистровая разновидность документа (TD-5). Путь без завершающего `/`,
        как в источнике.
        Источник: `salon1c.apib` → Group Оплата визитов → debt_visits.
      parameters:
        - $ref: '#/components/parameters/SalonId'
      responses:
        '200':
          description: "Массив долговых визитов"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtVisitsResponse'

  /hs/api/v1/visit_payment/{salon_id}/:
    post:
      operationId: "payVisit"
      tags: [visit-payment]
      summary: "Оплатить визит"
      description: |
        Проверяет возможность оплаты визита и проводит её; клиент определяется
        по `usertoken`. Успех — `Parameters.Result: true`.
        Источник: `salon1c.apib` → Group Оплата визитов → visit_payment.
      security:
        - ApiKeyAuth: []
          UserTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitPaymentRequest'
      responses:
        '200':
          description: "Результат оплаты"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: "API-ключ салона. Передаётся на каждый запрос — источник показывает его в заголовках всех операций."
    UserTokenAuth:
      type: apiKey
      in: header
      name: usertoken
      description: "Ключ авторизации клиента (UserToken), выдаётся методами авторизации. Требуется клиентским операциям — помечен `security` на уровне операции."
  parameters:
    SalonId:
      name: salon_id
      in: path
      required: true
      description: "Идентификатор салона (GUID). Присутствует во всех путях v1; у операций v2 его нет — это задокументированное расхождение, а не пропуск."
      schema:
        type: string
    StaffIdQuery:
      name: staff_id
      in: query
      required: false
      description: "Идентификатор сотрудника (GUID)"
      schema:
        type: string
    ServiceIdQuery:
      name: service_id
      in: query
      required: false
      description: "Идентификатор услуги (GUID)"
      schema:
        type: string
    DatetimeQuery:
      name: datetime
      in: query
      required: false
      description: "Дата/время отбора в iso8601; источник иллюстрирует базовым форматом без разделителей (`20170820T0000`) — один из трёх диалектов дат документа (TD-7)"
      schema:
        type: string
    StartDate:
      name: start_date
      in: query
      required: true
      description: "Начало периода в iso8601 (пример `20170820T0000`); автоматически берётся начало дня"
      schema:
        type: string
    EndDate:
      name: end_date
      in: query
      required: true
      description: "Конец периода в iso8601 (пример `20170831T0000`); автоматически берётся конец дня"
      schema:
        type: string
    RecordId:
      name: record_id
      in: query
      required: true
      description: "Идентификатор визита"
      schema:
        type: string
    ServiceIds:
      name: service_ids
      in: query
      required: false
      description: "Строка JSON с массивом услуг, которые сотрудник должен оказать последовательно/одновременно. Пример источника: `{\"services_array\":[\"140df5b4-5a58-11e7-82e7-0050568b5c8d\"]}`. Моделируется как query-параметр с `content: application/json` — сериализация `setQueryItemAsJSON`."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceIdsQuery'
    RecordArrayQuery:
      name: record_array
      in: query
      required: true
      description: "Строка JSON с массивом структур записи `{datetime, service_id, staff_id}`. Пример источника: `[{\"datetime\":\"20240831T1500\",\"service_id\":\"…\",\"staff_id\":\"…\"}]`."
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RecordItem'
    StartDateOptional:
      name: start_date
      in: query
      required: false
      description: "Начало периода в iso8601; автоматически берётся начало дня. Optional — так объявлено у визитовых операций (TD-6)"
      schema:
        type: string
    EndDateOptional:
      name: end_date
      in: query
      required: false
      description: "Конец периода в iso8601; автоматически берётся конец дня. Optional — так объявлено у визитовых операций (TD-6)"
      schema:
        type: string
  schemas:
    ApiError:
      type: object
      description: "Объект ошибки домена: приходит внутри `errors`/`Errors` даже при HTTP 200. Коды 1000–1114 задокументированы в приложении источника; 0 — успех. Поле остаётся открытым integer: каталог не исчерпывающий."
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: "Код ошибки; 0 — успех"
        message:
          type: [string, "null"]
          description: "Описание ошибки; в примерах встречается и пустая строка, и null"
    Meta:
      type: object
      description: "Пагинация в диалекте PascalCase (`Parameters`/`Errors`/`Meta`)."
      properties:
        items_count:
          type: integer
          description: "Общее количество найденных записей"
        pages_count:
          type: integer
          description: "Общее количество страниц"
        page_current:
          type: integer
          description: "Текущая страница"
        page_size:
          type: integer
          description: "Размер страницы"

    # --- Group Авторизация -------------------------------------------------

    AuthTypeItem:
      type: object
      description: "Вариант авторизации. `type`/`method` — открытые строки: источник перечисляет шесть типов и показывает седьмой (`email`) в своём же примере."
      required:
        - type
        - title
      properties:
        type:
          type: string
          description: "Тип авторизации: `sms`, `whats_app`, `call`, `outgoing_telegram`, `outgoing_whatsapp`, `outgoing_call`; в примере источника встречается и `email`"
        title:
          type: string
          description: "Представление типа авторизации"
        method:
          type: string
          description: "Способ авторизации: `incoming` | `outgoing`. Задокументирован в прозе, отсутствует в примере ответа — потому optional."
    AuthTypesResponse:
      type: object
      description: "Нижний (lowercase) диалект конверта."
      properties:
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/AuthTypeItem'
        errors:
          $ref: '#/components/schemas/ApiError'

    AuthRequest:
      type: object
      description: "Тело авторизации. В URI-шаблоне источника поля продублированы и строкой запроса — модель держит тело (TD-4)."
      required:
        - login
      properties:
        login:
          type: string
          description: "Номер телефона клиента, только цифры (пример `79876543210`)"
        confirmation_code:
          type: string
          description: "Код подтверждения; без него система генерирует и шлёт новый"
        name:
          type: string
          description: "Имя клиента"
        last_name:
          type: string
          description: "Фамилия клиента"
        second_name:
          type: string
          description: "Отчество клиента"
        birthday:
          type: string
          description: "Дата рождения в формате `31.12.1990`"
        email:
          type: string
          description: "Электронная почта клиента"
        auth_type:
          type: string
          description: "Выбранный тип авторизации; по умолчанию `sms`. Список — у `getAuthTypes`"
    AuthCodeSentEnvelope:
      type: object
      description: "Форма ответа `authorize` «код отправлен»: гибридный регистр — `Request_id`/`Parameters`/`Error`/`ErrorMessage`, только у этой операции (TD-5). `Request_id` обязателен — это ключ-различитель ветки oneOf: без него любой объект декодировался бы первой веткой."
      required:
        - Request_id
      properties:
        Request_id:
          type: string
        Parameters:
          type: object
          properties:
            sent_SMS:
              type: boolean
        Error:
          type: integer
        ErrorMessage:
          type: [string, "null"]
    UserTokenEnvelope:
      type: object
      description: "Конверт `Parameters`/`Errors` с выданным UserToken — общий ответ операций авторизации. `Parameters.UserToken` обязателен — второй ключ-различитель ветки oneOf у `authorize`."
      required:
        - Parameters
      properties:
        Parameters:
          type: object
          required:
            - UserToken
          properties:
            UserToken:
              type: string
              description: "Ключ клиента для заголовка `usertoken`"
        Errors:
          $ref: '#/components/schemas/ApiError'
    AuthResponse:
      description: "Обе задокументированные формы ответа `authorize`: «код отправлен» или «UserToken выдан»."
      oneOf:
        - $ref: '#/components/schemas/AuthCodeSentEnvelope'
        - $ref: '#/components/schemas/UserTokenEnvelope'

    UsertokenValidityResponse:
      type: object
      description: "Без конверта — единственная операция с голым ответом (TD-5)."
      properties:
        Result:
          type: boolean

    PrivateAuthRequest:
      type: object
      required:
        - sign
      properties:
        name:
          type: string
          description: "Имя клиента"
        second_name:
          type: string
          description: "Отчество клиента"
        last_name:
          type: string
          description: "Фамилия клиента"
        phone:
          type: string
          description: "Телефон клиента (пример `79876543210`)"
        email:
          type: string
          description: "Email клиента"
        sex:
          type: string
          description: "Пол клиента: `1` — мужской, `2` — женский. Строкой — так в источнике"
        birthday:
          type: string
          description: "Дата рождения в формате `31.12.1990`"
        sign:
          type: string
          description: "Цифровая подпись (SHA-256)"

    PhoneConfirmationRequest:
      type: object
      required:
        - phone
      properties:
        request_id:
          type: string
          description: "Идентификатор запроса"
        phone:
          type: string
          description: "Номер телефона клиента, только цифры"
        method:
          type: string
          description: "Способ подтверждения: `outgoing_telegram`, `outgoing_call`, `outgoing_whatsapp`"
        name:
          type: string
          description: "Имя клиента"
        last_name:
          type: string
          description: "Фамилия клиента"
        second_name:
          type: string
          description: "Отчество клиента"
        birthday:
          type: string
          description: "Дата рождения в формате `31.12.1990`"
        email:
          type: string
          description: "Электронная почта клиента"
    PhoneConfirmationPayload:
      type: object
      description: "Данные для подтверждения номера; набор полей зависит от `method` — все optional."
      properties:
        outgoing_id:
          type: string
          description: "Номер телефона или идентификатор бота для подтверждения"
        link:
          type: string
          description: "URL для завершения подтверждения"
        request_id:
          type: string
          description: "Идентификатор запроса (в таблице источника опечатка `reqiest_id`)"
        method:
          type: string
          description: "Способ подтверждения: `outgoing_telegram`, `outgoing_call`, `outgoing_whatsapp`"
    PhoneConfirmationResponse:
      type: object
      description: "Верхний (PascalCase) диалект конверта."
      properties:
        Parameters:
          $ref: '#/components/schemas/PhoneConfirmationPayload'
        Errors:
          $ref: '#/components/schemas/ApiError'

    ClientTokenRequest:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          description: "Идентификатор запроса (из `requestPhoneConfirmation`)"
        phone:
          type: string
          description: "Номер телефона клиента, только цифры"
        method:
          type: string
          description: "Способ подтверждения; у `auth_types` это `outgoing`"

    # --- Group Онлайн запись -------------------------------------------------

    ServiceIdsQuery:
      type: object
      description: "JSON-обёртка query-параметра `service_ids`; пример источника `{\"services_array\":[…]}`."
      required:
        - services_array
      properties:
        services_array:
          type: array
          items:
            type: string
          description: "Идентификаторы услуг в порядке оказания"

    RecordItem:
      type: object
      description: "Структура записи из Data Structure `Record` источника. Общая: элемент `record_array` в теле `bookVisit` и в query-параметре `getRecordCost`."
      required:
        - datetime
        - service_id
      properties:
        datetime:
          type: string
          description: "Дата и время занятия в iso8601 (пример `20240831T1500`)"
        service_id:
          type: string
          description: "Идентификатор услуги"
        staff_id:
          type: string
          description: "Идентификатор сотрудника; без него подставится любой свободный"

    ServiceCategory:
      type: object
      description: "Специализация (категория) услуги."
      properties:
        id:
          type: string
        title:
          type: string
        title_local:
          type: string
          description: "Локализованное наименование; в примере отсутствует"

    BookableService:
      type: object
      description: "Услуга, доступная для записи. Ключ `ServicesAtSameTime` — PascalCase среди snake_case-ключей объекта: ещё одна регистровая непоследовательность источника (TD-5), сохранена как есть."
      properties:
        id:
          type: string
        title:
          type: string
        title_local:
          type: string
        category:
          $ref: '#/components/schemas/ServiceCategory'
        price_min:
          type: integer
          description: "Минимальная стоимость услуги"
        price_max:
          type: integer
          description: "Максимальная стоимость услуги"
        comment:
          type: string
        comment_local:
          type: string
        active:
          type: boolean
        length:
          type: integer
          description: "Длительность оказания услуги в минутах"
        ServicesAtSameTime:
          type: array
          items:
            type: string
          description: "Услуги, которые можно оказать одновременно с текущей"
        sort_index:
          type: integer
        image:
          type: string
          description: "Фото услуги; в примере отсутствует"
    BookableServicesResponse:
      type: object
      description: "PascalCase-конверт; в примере источника `Errors` отсутствует."
      properties:
        Parameters:
          type: array
          items:
            $ref: '#/components/schemas/BookableService'
        Errors:
          $ref: '#/components/schemas/ApiError'

    RatingParameter:
      type: object
      description: "Параметр оценки."
      properties:
        id:
          type: string
        title:
          type: string
    StaffRating:
      type: object
      description: "Средняя оценка сотрудника по параметру. Во втором элементе примера источника ключ опечатан `rsating` — модель держит `rating` (TD-6). `rating` — number: в примерах встречается дробное 4.5."
      properties:
        rating_parameter:
          $ref: '#/components/schemas/RatingParameter'
        rating:
          type: number
        votes_count:
          type: integer
    StaffSpecialization:
      type: object
      description: "Должность сотрудника."
      properties:
        id:
          type: string
        title:
          type: string
        title_local:
          type: string
    BookableStaff:
      type: object
      description: "Сотрудник, доступный для записи."
      properties:
        id:
          type: string
        name:
          type: string
          description: "ФИО сотрудника"
        name_local:
          type: string
        specialization:
          $ref: '#/components/schemas/StaffSpecialization'
        weight:
          type: integer
          description: "Приоритет выбора сотрудника"
        information:
          type: string
          description: "Дополнительная информация (HTML)"
        information_local:
          type: string
        avatar:
          type: string
          description: "Путь к файлу аватарки"
        upcoming_dates:
          type: array
          items:
            type: string
          description: "До трёх ближайших доступных дат (ISO-8601 строками в примере)"
        upcoming_times:
          type: array
          items: {}
          description: "До двенадцати ближайших интервалов на ближайшую дату; форма элементов источником не показана — схема открыта (TD-6)"
        ratings:
          type: array
          items:
            $ref: '#/components/schemas/StaffRating'
        comments_count:
          type: integer
    BookableStaffResponse:
      type: object
      description: "PascalCase-конверт."
      properties:
        Parameters:
          type: array
          items:
            $ref: '#/components/schemas/BookableStaff'
        Errors:
          $ref: '#/components/schemas/ApiError'

    BookableDatesResponse:
      type: object
      description: "PascalCase-конверт; `Parameters` — массив дат ISO-8601 строками."
      properties:
        Parameters:
          type: array
          items:
            type: string
        Errors:
          $ref: '#/components/schemas/ApiError'

    BookTimeSlot:
      type: object
      description: "Слот записи."
      properties:
        time:
          type: string
          description: "Время слота (например, `10:30`)"
        seance_length:
          type: integer
          description: "Длительность слота в минутах"
        datetime:
          type: string
          description: "Дата и время слота, ISO-8601"
    BookableTimesResponse:
      type: object
      description: "PascalCase-конверт."
      properties:
        Parameters:
          type: array
          items:
            $ref: '#/components/schemas/BookTimeSlot'
        Errors:
          $ref: '#/components/schemas/ApiError'

    RecordingDatesItem:
      type: object
      description: "Даты записи одного сотрудника; `date` — строки `дд.мм.гггг чч:мм:сс` (TD-7)."
      properties:
        id:
          type: string
          description: "Идентификатор сотрудника"
        date:
          type: array
          items:
            type: string
    RecordingDatesResponse:
      type: object
      description: "PascalCase-конверт."
      properties:
        Parameters:
          type: array
          items:
            $ref: '#/components/schemas/RecordingDatesItem'
        Errors:
          $ref: '#/components/schemas/ApiError'

    BookVisitRequest:
      type: object
      description: "Плоское тело записи по списку `+ Attributes` источника (его пример тела ошибочно показывает форму ответа — TD-6). `record_array` обязателен, если не передан `record_id` существующего визита — условная обязательность описана, схемой не навязана."
      properties:
        record_array:
          type: array
          items:
            $ref: '#/components/schemas/RecordItem'
          description: "Массив записей; обязателен, если не передан `record_id`"
        fullname:
          type: string
          description: "ФИО клиента через пробелы; при передаче игнорируются `name`/`last_name`/`second_name`"
        name:
          type: string
        last_name:
          type: string
        second_name:
          type: string
        birthday:
          type: string
          description: "Дата рождения в формате `31.12.1990`"
        email:
          type: string
        notify_by_sms:
          type: number
          description: "Время до напоминания о записи в часах"
        comment:
          type: string
          description: "Комментарий к визиту"
        commercial:
          type: string
          description: "Рекламный источник"
        record_id:
          type: string
          description: "Идентификатор занятия; при передаче остальные параметры не нужны"
    PaymentAccount:
      type: object
      description: "Возможная оплата лицевым/бонусным счётом."
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
          description: "Тип счёта: `deposit` — лицевой, `bonus` — бонусный"
        payment_amount:
          type: number
    BookVisitResult:
      type: object
      description: "Результат записи. `status` — открытая строка: `Reserved`, `TemporarilyReservedNeedPayment` (визит отменят через 5 минут без оплаты), `ReservedAndPayed`."
      required:
        - Result
      properties:
        Result:
          type: boolean
        record_id:
          type: string
        status:
          type: string
        sum:
          type: number
          description: "Сумма визита; возвращается при статусе `TemporarilyReservedNeedPayment`"
        may_be_payment:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAccount'
          description: "Возможные оплаты; возвращается при статусе `TemporarilyReservedNeedPayment`"
    BookVisitResponse:
      type: object
      description: "PascalCase-конверт; `Errors` в примере `null` — optional покрывает это."
      properties:
        Parameters:
          $ref: '#/components/schemas/BookVisitResult'
        Errors:
          $ref: '#/components/schemas/ApiError'

    ResultPayload:
      type: object
      description: "Полезная нагрузка «флаг успеха»."
      required:
        - Result
      properties:
        Result:
          type: boolean
    ResultEnvelope:
      type: object
      description: "PascalCase-конверт `{Parameters:{Result}, Errors}` — общий ответ мутаций (`rescheduleVisit`, `cancelVisit`, далее по группам)."
      properties:
        Parameters:
          $ref: '#/components/schemas/ResultPayload'
        Errors:
          $ref: '#/components/schemas/ApiError'

    PackageValidity:
      type: object
      description: "Ограничение срока действия пакета услуг; набор полей зависит от `limitation_type` — все optional."
      properties:
        limitation_type:
          type: string
          description: "Тип ограничения: `validity_limitation` — периодом действия, `period_limitation` — по периоду"
        validity_type:
          type: string
          description: "Тип периода: `day` | `month`; при `validity_limitation`"
        count:
          type: integer
          description: "Количество периодов; при `validity_limitation`"
        start_date:
          type: string
          description: "Начало действия пакета; при `period_limitation`"
        end_date:
          type: string
          description: "Конец действия пакета; при `period_limitation`"
        validity_description:
          type: string
          description: "Описание срока действия (например, «2 месяца и 3 дня»)"
    IncludedService:
      type: object
      description: "Услуга, включённая в пакет."
      properties:
        id:
          type: string
        title:
          type: string
        count:
          type: integer
    Purchase:
      type: object
      description: "Номенклатура корзины. `type` — открытая строка: `service` | `product` | `package`."
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        validity:
          $ref: '#/components/schemas/PackageValidity'
        description:
          type: string
        services:
          type: array
          items:
            $ref: '#/components/schemas/IncludedService'
          description: "Включённые услуги; только для пакета, в примере `null`"
        pictures:
          type: array
          items:
            type: string
    PriceType:
      type: object
      description: "Цена номенклатуры."
      properties:
        id:
          type: string
        title:
          type: string
    CartItem:
      type: object
      description: "Позиция корзины расчёта. `balance`/`balance_warning` встречаются в примере, но не в таблице полей источника — сохранены optional (TD-6). `nds`: 1 — без НДС, 2 — 0%, 3 — 10%, 4 — 20%."
      properties:
        purchase:
          $ref: '#/components/schemas/Purchase'
        count:
          type: integer
        balance:
          type: number
        balance_warning:
          type: string
        price_type:
          $ref: '#/components/schemas/PriceType'
        price:
          type: number
        nds:
          type: integer
        nds_sum:
          type: number
        price_with_discount:
          type: number
        discount_sum:
          type: number
        payment_amount:
          type: number
    Promotion:
      type: object
      description: "Маркетинговая акция. `type` — открытая строка: `discount` | `bonus`."
      properties:
        type:
          type: string
        title:
          type: string
        amount:
          type: number
          description: "Сумма скидки"
    RecordCostPayload:
      type: object
      description: "Корзина расчёта стоимости."
      properties:
        cart:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        total_amount:
          type: number
          description: "Общая сумма к оплате"
        total_discount:
          type: number
          description: "Общая сумма скидки"
        may_be_payment:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAccount'
        promotions:
          type: array
          items:
            $ref: '#/components/schemas/Promotion'
        promocode:
          type: string
          description: "Применённый промокод"
    RecordCostResponse:
      type: object
      description: "Нижний (lowercase) диалект конверта — единственный в группе записи (TD-5)."
      properties:
        parameters:
          $ref: '#/components/schemas/RecordCostPayload'
        errors:
          $ref: '#/components/schemas/ApiError'

    # --- Group Визиты + Оплата визитов ----------------------------------------

    VisitClient:
      type: object
      description: "Клиент визита."
      properties:
        id:
          type: string
        name:
          type: string
          description: "ФИО клиента"
        phones:
          type: array
          items:
            type: string
    VisitServiceItem:
      type: object
      description: "Услуга визита."
      properties:
        id:
          type: string
        title:
          type: string
        sum:
          type: number
    VisitStaffRef:
      type: object
      description: "Сотрудник визита."
      properties:
        id:
          type: string
        title:
          type: string
          description: "ФИО сотрудника"
    VisitService:
      type: object
      description: "Оказанная услуга в составе визита."
      properties:
        start_date:
          type: string
          description: "Плановое время начала услуги (ISO-8601 в примерах)"
        end_date:
          type: string
          description: "Плановое время окончания услуги"
        service:
          $ref: '#/components/schemas/VisitServiceItem'
        staff:
          $ref: '#/components/schemas/VisitStaffRef'
    Visit:
      type: object
      description: "Визит. Общая структура `finished_visites` и `visites`; `status` документирован только у `visites` — `Expected`, `Came`, `Finished`, `NotCame`, `Canceled`, `Archival`, открытая строка."
      properties:
        id:
          type: string
        status:
          type: string
        actual_start_date:
          type: string
          description: "Фактическое время начала визита"
        actual_end_date:
          type: string
          description: "Фактическое время окончания визита"
        services:
          type: array
          items:
            $ref: '#/components/schemas/VisitService'
        client:
          $ref: '#/components/schemas/VisitClient'
    VisitsResponse:
      type: object
      description: "PascalCase-конверт; `Parameters` — массив визитов."
      properties:
        Parameters:
          type: array
          items:
            $ref: '#/components/schemas/Visit'
        Errors:
          $ref: '#/components/schemas/ApiError'

    DebtVisitCustomer:
      type: object
      description: "Клиент долгового визита; регистр PascalCase внутри полезной нагрузки (TD-5)."
      properties:
        Name:
          type: string
        Phone:
          type: string
        Email:
          type: string
    DebtVisitOrganization:
      type: object
      description: "Организация долгового визита."
      properties:
        TaxationSystemCode:
          type: string
        TaxationSystem:
          type: string
    DebtVisitService:
      type: object
      description: "Услуга долгового визита (фискальный состав чека). `Staff` в таблице объявлен объектом, а в примере приходит строкой — схема открыта (TD-6). `Department` есть в примере, отсутствует в таблице."
      properties:
        Name:
          type: string
        Quantity:
          type: number
        Price:
          type: number
        PriceWithDiscount:
          type: number
        DiscountSum:
          type: number
        Tax:
          type: string
          description: "Ставка НДС; в примере `null`"
        TaxSum:
          type: number
        Staff: {}
        Specialization:
          type: string
        Department:
          type: string
        BarCode:
          type: string
        CalculationMethod:
          type: string
        CalculationObject:
          type: string
        Sum:
          type: number
    DebtVisit:
      type: object
      description: "Визит с долгом. `CalculationType`/`FiscalCheck` в примере `null` — optional покрывает это."
      properties:
        Id:
          type: string
        CalculationType:
          type: string
        FiscalCheck:
          type: boolean
        Customer:
          $ref: '#/components/schemas/DebtVisitCustomer'
        Organization:
          $ref: '#/components/schemas/DebtVisitOrganization'
        Services:
          type: array
          items:
            $ref: '#/components/schemas/DebtVisitService'
    DebtVisitsResponse:
      type: object
      description: "PascalCase-конверт с PascalCase-полезной нагрузкой (TD-5)."
      properties:
        Parameters:
          type: array
          items:
            $ref: '#/components/schemas/DebtVisit'
        Errors:
          $ref: '#/components/schemas/ApiError'

    PaymentItem:
      type: object
      description: "Структура оплаты из Data Structure `PaymentList` источника. `type` — открытая строка: `cash` | `card` | `deposit` | `bonus`."
      required:
        - type
        - amount
      properties:
        type:
          type: string
        amount:
          type: number
        id:
          type: string
          description: "Лицевой/бонусный счёт; только при `deposit`/`bonus`"
    VisitPaymentRequest:
      type: object
      description: "Тело оплаты визита. `transaction_id` объявлен string, пример шлёт число `2134` — модель держит объявленный тип (TD-6)."
      required:
        - record_id
        - payment_list
        - transaction_id
      properties:
        record_id:
          type: string
          description: "Идентификатор визита"
        payment_list:
          type: array
          items:
            $ref: '#/components/schemas/PaymentItem'
        transaction_id:
          type: string
          description: "Идентификатор транзакции"
