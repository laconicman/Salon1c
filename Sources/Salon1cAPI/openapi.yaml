    Ticket:
      type: object
      description: "Пакет услуг / разовая услуга. `type` — `package` | `service`; `status` — `active` | `not_active` | `closed`. Ключ `avialable_actions` опечатан сервером — сохранён дословно. `count` бывает `null`. Поля `total_frozen`/`balance_frozen`/`min_frozen_count`/`total_guest_visit`/`balance_guest_visit`/`freeze_list` есть в примере, отсутствуют в таблице — optional (TD-6)."
      properties:
        title:
          type: string
        ticket_id:
          type: string
        item_id:
          type: string
        type:
          type: string
        status:
          type: string
        end_date:
          type: string
        start_status_date:
          type: string
        end_status_date:
          type: string
        active_date:
          type: string
        count:
