        total_frozen:
          type: number
        balance_frozen:
          type: number
        min_frozen_count:
          type: number
        total_guest_visit:
          type: number
        balance_guest_visit:
          type: number
        freeze_list:
          type: array
          items: {}
          description: "Заморозки пакета; состав элементов не показан"
