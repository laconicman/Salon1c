      type: object
      description: "Фильтр выборки — Data Structure `Filter` источника. `type`: `id` | `name` | `surname` | `patronymic` | `phone` | `email`; `value` — «может быть как строкой, так и массивом строк»."
      required:
        - type
        - value
      properties:
        type:
          type: string
        value:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
    ClientsQuery:
      type: object
      description: "Тело выборки клиентов. `salon_id` обязателен и в пути, и здесь — так объявлено (TD-6). `order_by_direction`: `ASC` | `DESC`."
      required:
        - salon_id
      properties:
        salon_id:
          type: string
        page:
          type: integer
          description: "Номер страницы; по умолчанию 1"
        count:
          type: integer
          description: "Записей на странице; по умолчанию 20"
        order_by:
          type: string
          description: "Поле сортировки (`name`, `surname`, …)"
        order_by_direction:
          type: string
          enum: [ASC, DESC]
        fields:
          type: array
          items:
            type: string
          description: "Список возвращаемых полей клиента"
        filters:
          type: array
          items:
            $ref: '#/components/schemas/ClientFilter'
    ClientsResponse:
      type: object
      description: "PascalCase-конверт с `Meta` — пагинация выборки."
      properties:
        Parameters:
          type: array
          items:
            $ref: '#/components/schemas/ClientListItem'
        Errors:
          $ref: '#/components/schemas/ApiError'
        Meta:
          $ref: '#/components/schemas/Meta'
    ErrorsEnvelope:
      type: object
      description: "Конверт ошибки без `Parameters` — документированные HTTP 400."
      properties:
        Errors:
          $ref: '#/components/schemas/ApiError'

    ClientCreateRequest:
      type: object
      description: "Создание клиента — Data Structure `ClientCreate` плюс `salon_id` тела. `phone` объявлен `number` — так в источнике (TD-6); `sex`: 0 — не указан, 1 — мужской, 2 — женский; `birth_date` в формате `YYYY-MM-DD` — четвёртый диалект дат (TD-7)."
      required:
        - salon_id
        - phone
      properties:
        salon_id:
          type: string
        name:
          type: string
        surname:
          type: string
        patronymic:
          type: string
        phone:
          type: number
          description: "Телефон, только цифры — объявлен number, в отличие от строковых телефонов соседних операций"
        email:
          type: string
        sex:
          type: number
        birth_date:
          type: string
    ClientUpdateRequest:
      type: object
      description: "Изменение клиента — `ClientCreate` плюс `id` и `salon_id` тела; `phone` здесь уже `string` (TD-6)."
      required:
        - salon_id
        - id
      properties:
        salon_id:
          type: string
        id:
          type: string
        name:
          type: string
        surname:
          type: string
        patronymic:
          type: string
        phone:
          type: string
        email:
          type: string
        sex:
          type: number
        birth_date:
          type: string
    ClientResponse:
      type: object
      description: "PascalCase-конверт; `Parameters` — созданный/изменённый клиент (Data Structure `Client`)."
      properties:
        Parameters:
          $ref: '#/components/schemas/ClientListItem'
        Errors:
          $ref: '#/components/schemas/ApiError'

    DepositAccount:
      type: object
      description: "Лицевой/бонусный/авансовый счёт. `deposit_type` — открытая строка: `deposit` | `bonus` | `advance`. `id` — `null` у авансового счёта. `history_exist` объявлен string, пример шлёт boolean — модель держит пример (TD-6)."
      properties:
        id:
          type: string
        title:
          type: string
        deposit_type:
          type: string
        history_exist:
          type: boolean
    ClientAccountEntry:
      type: object
      description: "Счёт с остатком."
      properties:
