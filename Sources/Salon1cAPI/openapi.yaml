      properties:
        Result:
          type: boolean
        data_client:
          type: object
          properties:
            full_name:
              type: string
            name:
              type: string
            second_name:
              type: string
            last_name:
              type: string
            birthday:
              type: string
            sex:
              type: string
            email:
              type: array
              items:
                type: string
    ClientProfileUpdateResponse:
      type: object
      description: "PascalCase-конверт; `Errors` в примере `null`."
      properties:
        Parameters:
          $ref: '#/components/schemas/ClientProfileResult'
        Errors:
          $ref: '#/components/schemas/ApiError'

