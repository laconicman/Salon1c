    PriceItem:
      type: object
      description: "Позиция прайс-листа. `price` — строкой (`\"1000\"`), `description`/`services`/`validity`/`available_time`/`balance`/`country_origin` бывают `null`. `type` — `product` | `package` | `gift_certificate`, открытая строка."
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        category:
          $ref: '#/components/schemas/ServiceCategory'
        price:
          type: string
          description: "Цена строкой — так в примере источника (TD-6)"
        description:
          type: string
        services:
          type: array
          items:
            $ref: '#/components/schemas/IncludedService'
          description: "Включённые услуги пакета; `null` иначе"
        validity:
          $ref: '#/components/schemas/PackageValidity'
        available_time:
          type: string
        balance:
          type: number
          description: "Остаток; `null` для неучитываемых (пакеты)"
        pictures:
          type: array
          items:
            type: string
        country_origin:
          type: string
        article:
          type: string
        unit:
          type: string
        additional_details:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalDetail'
    ProductGroup:
      type: object
      description: "Раздел товаров; `included_groups` — рекурсивные подчинённые разделы, `null` на листьях."
      properties:
        id:
          type: string
        title:
          type: string
        included_groups:
          type: array
          items:
            $ref: '#/components/schemas/ProductGroup'
        sort_index:
          type: integer
    PriceListParameters:
      type: object
      description: "Полезная нагрузка прайс-листа; `errors` вложен сюда же, а не в конверт — уникальная вложенность (TD-5). `group_list` только при `with_group`."
      properties:
        price_client:
          type: array
          items:
            $ref: '#/components/schemas/PriceItem'
        navigation:
          $ref: '#/components/schemas/Navigation'
        errors:
          $ref: '#/components/schemas/ApiError'
        group_list:
          type: array
          items:
            $ref: '#/components/schemas/ProductGroup'
    PriceListResponse:
      type: object
      description: "Нижний диалект; внешнего `errors` нет — он внутри `parameters`."
      properties:
        parameters:
          $ref: '#/components/schemas/PriceListParameters'

    CartQueryItem:
      type: object
      description: "Покупка корзины — Data Structure `cart` источника. `staff_id` — для терминалов самообслуживания."
      required:
        - purchase_id
      properties:
        purchase_id:
          type: string
        count:
          type: number
        staff_id:
          type: string
    DeliveryQuery:
      type: object
      description: "Услуга доставки в запросе — Data Structure `delivery` источника. `options` обязателен но бывает `null` — объект данных ЯД."
      required:
        - id
        - price
        - options
      properties:
        id:
          type: string
        price:
          type: number
        options: {}
    CartClientQuery:
      type: object
      description: "Данные клиента строкой JSON — Data Structure `client` источника; обязателен без `usertoken` (тогда `phone`/`last_name`/`name` необходимы)."
      properties:
        phone:
          type: string
        last_name:
          type: string
        name:
          type: string
        second_name:
          type: string
        birthday:
          type: string
          description: "Формат `31.12.1990`"
    GiftRecipient:
      type: object
      description: "Получатель подарочного сертификата — Data Structure `GiftTo`."
      required:
        - phone
      properties:
        phone:
          type: string
        name:
          type: string
        email:
          type: string
    DeliveryItem:
      type: object
      description: "Услуга доставки в ответе; `id` — `null` у самовывоза, `code` — `pickup` | `courier`."
      properties:
        id:
          type: string
        title:
          type: string
        price:
          type: number
        code:
          type: string
        checked:
          type: boolean
    PaymentTypeRef:
      type: object
      description: "Доступный тип оплаты."
      properties:
        type:
          type: string
        title:
          type: string
    CartCostPayload:
      type: object
      description: "Расчёт корзины. `gift_to`/`delivery`/`promocode`/`user_token` бывают `null`; `user_token` возвращается, если `usertoken` не передан в заголовках — выдача токена внутри ответа (TD-6)."
      properties:
        cart:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        total_amount:
          type: number
        total_discount:
          type: number
        may_be_payment:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAccount'
        promotions:
          type: array
          items:
            $ref: '#/components/schemas/Promotion'
        gift_to:
          $ref: '#/components/schemas/GiftRecipient'
        delivery:
          $ref: '#/components/schemas/DeliveryItem'
        user_token:
          type: string
        promocode:
          type: string
        payment_types:
          type: array
          items:
            $ref: '#/components/schemas/PaymentTypeRef'
    CartCostResponse:
      type: object
      description: "Нижний диалект конверта."
      properties:
        parameters:
          $ref: '#/components/schemas/CartCostPayload'
        errors:
          $ref: '#/components/schemas/ApiError'

    OrderPaymentRequest:
      type: object
      description: "Тело оплаты заказа. `transaction_id` объявлен string, пример шлёт число `1211` — держим объявленный тип (TD-6)."
      required:
        - transaction_id
        - cart
        - payment_list
      properties:
        transaction_id:
          type: string
        cart:
          type: array
          items:
            $ref: '#/components/schemas/CartQueryItem'
        payment_list:
          type: array
          items:
            $ref: '#/components/schemas/PaymentItem'
        gift_to:
          $ref: '#/components/schemas/GiftRecipient'
        comment:
          type: string
        address:
          type: string
        delivery:
          $ref: '#/components/schemas/DeliveryQuery'
        promocode:
          type: string
    LowercaseResultPayload:
      type: object
      description: "Флаг успеха нижним регистром — `result`, не `Result` (TD-5)."
      required:
        - result
      properties:
        result:
          type: boolean
    LowercaseResultEnvelope:
      type: object
      description: "Нижний диалект конверта с нижним `result`."
      properties:
        parameters:
          $ref: '#/components/schemas/LowercaseResultPayload'
        errors:
          $ref: '#/components/schemas/ApiError'

    ProductGroupsResponse:
      type: object
      description: "Нижний диалект конверта."
      properties:
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ProductGroup'
        errors:
          $ref: '#/components/schemas/ApiError'

    StoreContactEntry:
      type: object
      description: "Вид контакта магазина: `Телефон`, `Email`, `Фактический адрес`, `Короткий адрес`, `Сайт` — открытые строки."
      properties:
        type:
          type: string
        title:
          type: string
    StoreContacts:
      type: object
      description: "Контакты интернет-магазина."
      properties:
        id:
          type: string
        name:
          type: string
        contact_information:
          type: array
          items:
            $ref: '#/components/schemas/StoreContactEntry'
        work_schedule:
          type: string
        pictures:
          type: array
          items:
            type: string
    StoreContactsResponse:
      type: object
      description: "Нижний диалект конверта."
      properties:
        parameters:
          $ref: '#/components/schemas/StoreContacts'
        errors:
          $ref: '#/components/schemas/ApiError'

    OrderPurchase:
      type: object
      description: "Позиция заказа. `type` — `service` | `product` | `package` | `gift_certificate`, открытая строка."
      properties:
        title:
          type: string
        type:
          type: string
        unit:
          type: string
        count:
          type: number
        price:
          type: number
        price_with_discount:
          type: number
        discount_sum:
          type: number
        payment_sum:
          type: number
        pictures:
          type: array
          items:
            type: string
    Order:
      type: object
      description: "Заказ покупателя. `status` — представление (`Открыт`), `status_id` — УИД; `shipment_date` бывает `null`."
      properties:
        id:
          type: string
        number:
          type: string
        shipment_date:
          type: string
        date:
          type: string
        status:
          type: string
        status_id:
          type: string
        comment:
          type: string
        purchase_list:
          type: array
          items:
            $ref: '#/components/schemas/OrderPurchase'
        order_price:
          type: number
        order_discount:
          type: number
        order_with_discount:
          type: number
    OrderListPayload:
      type: object
      description: "Полезная нагрузка истории заказов."
      properties:
        order_list:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        navigation:
          $ref: '#/components/schemas/Navigation'
    OrderListResponse:
      type: object
      description: "Нижний диалект конверта."
      properties:
        parameters:
          $ref: '#/components/schemas/OrderListPayload'
        errors:
          $ref: '#/components/schemas/ApiError'

    OrderStatus:
      type: object
      description: "Возможный статус заказа."
      properties:
        id:
          type: string
        title:
          type: string
    OrderStatusesResponse:
      type: object
      description: "Нижний диалект конверта."
      properties:
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatus'
        errors:
          $ref: '#/components/schemas/ApiError'

    DepositMovement:
      type: object
      description: "Движение по счёту; `date` — `yyyy-mm-dd HH:MM` (TD-7), `operation` — представление (`Взнос`/`Списание`)."
      properties:
        id:
          type: string
        date:
          type: string
        operation:
          type: string
        cost:
          type: number
    DepositDetailPayload:
      type: object
      description: "Полезная нагрузка расшифровки."
      properties:
        deposit_detail:
          type: array
          items:
            $ref: '#/components/schemas/DepositMovement'
        navigation:
          $ref: '#/components/schemas/Navigation'
    DepositDetailResponse:
      type: object
      description: "Нижний диалект конверта."
      properties:
        parameters:
          $ref: '#/components/schemas/DepositDetailPayload'
        errors:
          $ref: '#/components/schemas/ApiError'

    DeliveryListResponse:
      type: object
      description: "Нижний диалект конверта."
      properties:
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryItem'
        errors:
          $ref: '#/components/schemas/ApiError'

    ProductFilterValue:
      type: object
      description: "Значение фильтра товаров."
      properties:
        id:
          type: string
        title:
          type: string
    ProductFilter:
      type: object
      description: "Фильтр товаров со значениями."
      properties:
        id:
          type: string
        title:
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/ProductFilterValue'
    FilterListResponse:
      type: object
      description: "Нижний диалект конверта."
      properties:
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ProductFilter'
        errors:
          $ref: '#/components/schemas/ApiError'

    # --- Group Терминал самообслуживания (v2) ---------------------------------

    TerminalStaffItem:
      type: object
      description: "Сотрудник терминала — свои имена полей (`employee_name`/`specialization_name`), отличные от v1."
      properties:
        id:
          type: string
        specialization_name:
          type: string
        employee_name:
          type: string
        image:
          type: string
    TerminalStaffResponse:
      type: object
      description: "Нижний диалект конверта."
      properties:
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/TerminalStaffItem'
        errors:
          $ref: '#/components/schemas/ApiError'

    TerminalServiceItem:
      type: object
      description: "Услуга терминала; `price` объявлена `int` — целочисленная (TD-6)."
      properties:
        id:
          type: string
        title:
          type: string
        category_name:
          type: string
        price:
          type: integer
        image:
          type: string
    TerminalServicesResponse:
      type: object
      description: "Нижний диалект конверта."
      properties:
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/TerminalServiceItem'
        errors:
          $ref: '#/components/schemas/ApiError'

    TerminalClientData:
      type: object
      description: "Данные клиента терминала; `usertoken` — ключ для одноимённого заголовка последующих вызовов."
      properties:
        id:
          type: string
        phone:
          type: string
        last_name:
          type: string
        name:
          type: string
        second_name:
          type: string
        usertoken:
          type: string
    TerminalClientLookupPayload:
      type: object
      description: "`client_data` — `null`, когда `client_found` ложь."
      properties:
        client_found:
          type: boolean
        client_data:
          $ref: '#/components/schemas/TerminalClientData'
    TerminalClientLookupResponse:
      type: object
      description: "Нижний диалект конверта."
      properties:
        parameters:
          $ref: '#/components/schemas/TerminalClientLookupPayload'
        errors:
          $ref: '#/components/schemas/ApiError'

    TerminalAuthRequest:
      type: object
      description: "Запрос авторизации терминала; `birthday` — `31.12.1990`."
      required:
        - phone
      properties:
        phone:
          type: string
        name:
          type: string
        birthday:
          type: string
    TerminalAuthPayload:
      type: object
      description: "PascalCase-поле `UserToken` внутри нижнего конверта — гибридный диалект (TD-5)."
      properties:
        UserToken:
          type: string
    TerminalAuthResponse:
      type: object
      description: "Нижний конверт, PascalCase-полезная нагрузка."
      properties:
        parameters:
          $ref: '#/components/schemas/TerminalAuthPayload'
        errors:
          $ref: '#/components/schemas/ApiError'

    TerminalCartQueryItem:
      type: object
      description: "Покупка корзины терминала: `staff_id` обязателен, `count` в примере не встречается (услуги на терминале одноместные — TD-6)."
      required:
        - purchase_id
        - staff_id
      properties:
        purchase_id:
          type: string
        staff_id:
          type: string
    TerminalPurchase:
      type: object
      description: "Номенклатура в корзине терминала; `type` — `service` | `package` | `gift_certificate`."
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        description:
          type: string
        pictures:
          type: array
          items:
            type: string
    TerminalCartItem:
      type: object
      description: "Позиция расчёта корзины терминала; `nds`/`nds_sum`/`payment_object`/`payment_method` — признаки фискализации, которых нет у магазинных позиций."
      properties:
        purchase:
          $ref: '#/components/schemas/TerminalPurchase'
        count:
          type: number
        price_type:
          $ref: '#/components/schemas/PriceType'
        price:
          type: number
        nds:
          type: number
        nds_sum:
          type: number
        price_with_discount:
          type: number
        discount_sum:
          type: number
        payment_amount:
          type: number
        payment_object:
          type: string
        payment_method:
          type: string
    TerminalCartCostPayload:
      type: object
      description: "Полезная нагрузка расчёта корзины терминала."
      properties:
        cart:
          type: array
          items:
            $ref: '#/components/schemas/TerminalCartItem'
        total_amount:
          type: number
        total_discount:
          type: number
        may_be_payment:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAccount'
        promotions:
          type: array
          items:
            $ref: '#/components/schemas/Promotion'
        promocode:
          type: string
    TerminalCartCostResponse:
      type: object
      description: "Нижний диалект конверта."
      properties:
        parameters:
          $ref: '#/components/schemas/TerminalCartCostPayload'
        errors:
          $ref: '#/components/schemas/ApiError'

    TerminalPaymentRequest:
      type: object
      description: "Тело оплаты терминала; `receipt_number` обязателен — номер чека ККМ. `payment_list` объявлен `PaymentList`, пример шлёт `amount` строками (TD-6) — держим `number`."
      required:
        - transaction_id
        - receipt_number
        - cart
        - payment_list
      properties:
        transaction_id:
          type: string
        receipt_number:
          type: string
        cart:
          type: array
          items:
            $ref: '#/components/schemas/TerminalCartQueryItem'
        payment_list:
          type: array
          items:
            $ref: '#/components/schemas/PaymentItem'
        promocode:
          type: string
    TerminalPaymentResultPayload:
      type: object
      description: "Нижний `result` плюс `record_id` созданного визита."
      required:
        - result
      properties:
        result:
          type: boolean
        record_id:
          type: string
    TerminalPaymentResponse:
      type: object
      description: "Нижний диалект конверта."
      properties:
        parameters:
          $ref: '#/components/schemas/TerminalPaymentResultPayload'
        errors:
          $ref: '#/components/schemas/ApiError'
