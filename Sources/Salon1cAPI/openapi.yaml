          type: string
        promocode:
          type: string
    ClientCard:
      type: object
      description: "Карточка клиента. `status` — открытая строка: `new` | `constant` | `potential` | `lost`. `email` — массив адресов, в отличие от одиночного `email` в других операциях (TD-6)."
      properties:
        full_name:
          type: string
        name:
          type: string
        second_name:
          type: string
        last_name:
          type: string
        birthday:
          type: string
          description: "Дата рождения; в примерах `31.12.1990`"
        sex:
          type: string
          description: "Пол представлением; в примере `null`"
        email:
          type: array
          items:
            type: string
        records_to_rate:
          type: array
          items:
            $ref: '#/components/schemas/ClientRecordToRate'
        cards:
          type: array
          items:
            $ref: '#/components/schemas/ClientCardItem'
        promocodes:
          type: array
          items:
            $ref: '#/components/schemas/ClientPromocode'
        status:
          type: string
    ClientCardResponse:
      type: object
      description: "PascalCase-конверт; `Parameters` — карточка клиента."
      properties:
        Parameters:
          $ref: '#/components/schemas/ClientCard'
        Errors:
          $ref: '#/components/schemas/ApiError'

    ClientListItem:
      type: object
      description: "Клиент списка `searchClients` — Data Structure `Client` плюс поля `sex`/`sex_id`/`status`/`status_id` из таблицы метода (в самой структуре их нет — TD-6). `birth_date`/`email` бывают `null`."
      properties:
        id:
          type: string
        salon_id:
          type: string
        name:
          type: string
        surname:
          type: string
        patronymic:
          type: string
        birth_date:
          type: string
          description: "Дата рождения; бывает `null`"
        phone:
          type: string
        email:
          type: string
          description: "Бывает `null`"
        sold_amount:
          type: number
        visits_count:
          type: number
        sex:
          type: string
          description: "Пол представлением"
        sex_id:
          type: number
          description: "Пол: 1 — мужской, 2 — женский, 0 — не указан"
        status:
          type: string
          description: "Статус представлением"
        status_id:
          type: number
          description: "Статус: 0 — потенциальный, 1 — новый, 2 — постоянный, 3 — потерянный, 4 — отказ"
